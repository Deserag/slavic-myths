<text x="52" y="1227" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#b6c8d4">Легенда: цветные прямоугольники — резерв зон, НЕ готовые макеты зданий. Перед реализацией требуется точная послойная кладка каждого объекта.</text>
<text x="52" y="1257" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#b6c8d4">Контроль: геометрия крепостного периметра неизменна; адаптируются только внешний фундамент, подъезд/мост и общий поворот города.</text>
