<text class="lead" x="1082" y="541">УТВЕРЖДЁННЫЕ ПРОПОРЦИИ</text>
<text x="1082" y="585" class="sub">Тело: 5–6 блоков длиной</text><text x="1082" y="613" class="sub">(БЕЗ учёта крыльев)</text>
<text x="1082" y="660" class="sub">Четыре раздельных крыла:</text><text x="1082" y="686" class="small">2 главных + 2 верхних мутировавших</text>
<text x="1082" y="734" class="sub">1 голова ворона, 2 лапы</text><text x="1082" y="758" class="small">Клюв, грудь, хвост — узнаваемые</text>
<text x="1082" y="810" class="sub">Размах для блокаута: ~14–18</text><text x="1082" y="837" class="small">уточнить по фактическим кадрам,</text><text x="1082" y="860" class="small">не фиксировать до проверки</text>
<text x="1082" y="918" class="small">Рисунок — размерная схема. ПНГ-лист</text><text x="1082" y="943" class="small">художественно приоритетнее.</text></svg>