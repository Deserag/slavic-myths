<text x="41" y="746" class="title">ПРОВЕРКИ В ЧЕТЫРЁХ ВИДАХ, КОТОРЫЕ НЕЛЬЗЯ ПРОПУСКАТЬ</text>
<text x="48" y="792" class="head">1. Исходный PNG → item model → display transforms</text>
<text x="48" y="838" class="head">2. Сохранить обычные точки хвата; без слома оружейных анимаций</text>
<text x="48" y="884" class="head">3. Новая форма только при доказанном дефекте конкретного ID</text>
<text x="48" y="930" class="head">4. Один item ID во всех четырёх видах: A/B на одинаковом масштабе</text>
<text x="41" y="978" class="note">Менять только дефектный item/model; размеры модели и пользовательские сохранения не изменять без отдельного согласования.</text>
