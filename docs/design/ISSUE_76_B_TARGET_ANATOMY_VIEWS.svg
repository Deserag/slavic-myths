<text x="44" y="1052" class="s">Две стойки — ОДИН rig; рост в 2.8 блока только согласно фактической коллизии.</text>
<rect x="962" y="598" width="896" height="480" rx="3" fill="#1d2830" stroke="#6a7980" stroke-width="2"/>
<text x="985" y="638" class="h">ТЕХНИЧЕСКИЕ ГРАНИЦЫ ВИЗУАЛА</text>
<text x="992" y="682" class="s">1. Узкая шея между головой и грудью, не цельная коробка.</text>
<text x="992" y="725" class="s">2. Грудь массивнее таза, но не закрывает четыре лапы.</text>
<text x="992" y="768" class="s">3. Передние и задние ноги имеют локоть/колено и отдельную лапу.</text>
<text x="992" y="811" class="s">4. Силуэт порочный и тяжёлый: шрамы и мех, но без шипов ради шипов.</text>
<text x="992" y="854" class="s">5. Глаза/челюсть видны в idle; исключение ESCAPE 19–49 ticks.</text>
<text x="992" y="897" class="s">6. Реальный render DEPTH_SCALE=0.68 проверить на сплющивание.</text>
<text x="992" y="940" class="s">7. Геометрия обязана пройти idle → RISE → upright → DROP.</text>
<text x="992" y="983" class="s">8. Показать в Minecraft до/после, без подмены offline эскизом.</text>
<text x="1006" y="1044" class="mini">Рисунок = ЦЕЛЕВОЙ НАПРАВЛЯЮЩИЙ СИЛУЭТ, не зафиксированные размеры UV/rig.</text>
<text x="22" y="1116" class="s">РАЗМЕРНЫЕ ПРАВИЛА: 16 model units = 1 block. Точные pivots/UV и числа финальной геометрии выводить из существующей модели и теста обеих стоек.</text>
<text x="22" y="1150" class="s">НЕЛЬЗЯ: портить Серого Волка, старого волколака, gameplay hitbox, тайминги, сюжет, звуки, сохранения. Корректировать только новую модель проклятого оборотня.</text>
<text x="22" y="1208" class="s">Обязательная приёмка: исходный 8-видовой atlas, новый 8-видовой atlas в том же масштабе, анимации, живые скриншоты и контроль движений.</text>
</svg>