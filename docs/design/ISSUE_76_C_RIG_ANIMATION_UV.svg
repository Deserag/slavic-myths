<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1240" viewBox="0 0 1780 1240"><rect width="1780" height="1240" fill="#151a20"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#e9e0d2}.title{font-size:27px;font-weight:bold}.head{font-size:19px;font-weight:bold}.text{font-size:16px}.sub{font-size:14px;fill:#aeb8bd}</style>
<text x="28" y="46" class="title">#76 • RIG / UV / СТОЙКИ / ТАЙМИНГИ — ЧЕРТЁЖ СОВМЕСТИМОСТИ</text>
<text x="28" y="79" class="sub">Не заменять один pivot новым названием без миграции всех дочерних частей; никакой декоративный эскиз не заменяет эти проверки.</text>
<rect x="20" y="104" width="830" height="518" rx="4" fill="#222b33" stroke="#89785e" stroke-width="2"/>
