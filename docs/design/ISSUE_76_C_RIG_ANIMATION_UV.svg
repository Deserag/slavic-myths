<text x="38" y="597" class="sub">Нота: 92 части / 94 кубоида; дерево выше показывает только ключевые опорные цепи.</text>
<rect x="868" y="104" width="895" height="518" rx="4" fill="#222b33" stroke="#89785e" stroke-width="2"/>
<text x="886" y="143" class="head">2. ДВЕ СТОЙКИ, ОДИН SKELETON</text>
<rect x="905" y="167" width="178" height="73" rx="4" fill="#303d45" stroke="#89785e" stroke-width="2"/>
<text x="915" y="210" class="text">QUADRUPED</text>
<rect x="1107" y="167" width="178" height="73" rx="4" fill="#303d45" stroke="#89785e" stroke-width="2"/>
<text x="1117" y="210" class="text">RISE</text>
<rect x="1305" y="167" width="178" height="73" rx="4" fill="#435342" stroke="#89785e" stroke-width="2"/>
<text x="1315" y="210" class="text">UPRIGHT</text>
<rect x="1501" y="167" width="178" height="73" rx="4" fill="#303d45" stroke="#89785e" stroke-width="2"/>
<text x="1511" y="210" class="text">DROP</text>
<path d="M1080 207L1117 207" fill="none" stroke="#e0b36d" stroke-width="3"/>
<text x="1089" y="197" class="head">→</text>
<path d="M1277 207L1314 207" fill="none" stroke="#e0b36d" stroke-width="3"/>
<text x="1286" y="197" class="head">→</text>
<path d="M1474 207L1511 207" fill="none" stroke="#e0b36d" stroke-width="3"/>
<text x="1483" y="197" class="head">→</text>
<text x="902" y="312" class="text">Динамический stance(f) зависит от root, pelvis, spine, chest, neck, head.</text>
<text x="902" y="354" class="text">Меняются thigh + shin + foot, upper + fore + hand.</text>
<text x="902" y="396" class="text">В QUAD опора 4 лап, в UPRIGHT — только задние лапы.</text>
<text x="902" y="438" class="text">Не изменять default dimensions 1.65 × 1.9 / 2.8 блока.</text>
<text x="902" y="480" class="text">Проверить границы перехода RISE: t=7..15, DROP: t=0..6.</text>
<text x="902" y="548" class="sub">Текущий renderer DEPTH_SCALE=.68: до/после проверить Z.</text>
<rect x="20" y="644" width="1090" height="566" rx="4" fill="#222b33" stroke="#89785e" stroke-width="2"/>
<text x="38" y="684" class="head">3. АНИМАЦИИ: МАТРИЦА ПРОВЕРКИ</text>
<rect x="38" y="716" width="280" height="53" rx="4" fill="#2c3941" stroke="#7b8f9b" stroke-width="2"/>
<text x="52" y="750" class="text">IDLE/ALERT</text>
<rect x="38" y="784" width="280" height="53" rx="4" fill="#2c3941" stroke="#7b8f9b" stroke-width="2"/>
<text x="52" y="818" class="text">CLAW_L/R</text>
<rect x="38" y="852" width="280" height="53" rx="4" fill="#2c3941" stroke="#7b8f9b" stroke-width="2"/>
<text x="52" y="886" class="text">BITE/DOUBLE/TRIPLE</text>
<rect x="38" y="920" width="280" height="53" rx="4" fill="#2c3941" stroke="#7b8f9b" stroke-width="2"/>
<text x="52" y="954" class="text">POUNCE/FLANK</text>
<rect x="38" y="988" width="280" height="53" rx="4" fill="#2c3941" stroke="#7b8f9b" stroke-width="2"/>
<text x="52" y="1022" class="text">GRAB/ROAR/HOWL</text>
<rect x="38" y="1056" width="280" height="53" rx="4" fill="#413036" stroke="#bb8171" stroke-width="2"/>
<text x="52" y="1090" class="text">ESCAPE / FAKE DEATH</text>
<text x="343" y="751" class="text">head aim; обе стойки; без вращения всего корпуса</text>
<path d="M323 735L1090 735" fill="none" stroke="#56636b" stroke-width="1"/>
<text x="343" y="819" class="text">цепи рук сохраняют длину; касание hit window</text>
<path d="M323 803L1090 803" fill="none" stroke="#56636b" stroke-width="1"/>
<text x="343" y="887" class="text">jaw + fangs, не сквозь нос и шею</text>
<path d="M323 871L1090 871" fill="none" stroke="#56636b" stroke-width="1"/>
<text x="343" y="955" class="text">опора лап при отталкивании и приземлении</text>
<path d="M323 939L1090 939" fill="none" stroke="#56636b" stroke-width="1"/>
<text x="343" y="1023" class="text">руки не проходят через грудь/цель</text>
<path d="M323 1007L1090 1007" fill="none" stroke="#56636b" stroke-width="1"/>
<text x="343" y="1091" class="text">ложная смерть; глаза скрыты только в t=19…49</text>
<path d="M323 1075L1090 1075" fill="none" stroke="#56636b" stroke-width="1"/>
<text x="39" y="1178" class="sub">Дополнительно: SNIFF, LISTEN, SNARL, STAGGER, DROP, RISE, WALK и damage states.</text>
<rect x="1132" y="644" width="631" height="566" rx="4" fill="#222b33" stroke="#89785e" stroke-width="2"/>
