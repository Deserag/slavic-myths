<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><rect width="1600" height="1030" fill="#132023"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#e9e4d6} .title{font-size:31px;font-weight:bold}.h{font-size:21px;font-weight:bold}.small{font-size:15px;fill:#b7c3bd}.panel{fill:#203035;stroke:#718685;stroke-width:2}.wood{fill:#7a5032;stroke:#c9a17b;stroke-width:3}.iron{fill:#8799a0;stroke:#d3e2e2;stroke-width:3}.purple{fill:#515077;stroke:#a7a6e0;stroke-width:3}.gold{fill:#bb9a4e;stroke:#ead59a;stroke-width:3}.chain{stroke:#ccd2cf;stroke-width:8;stroke-linecap:square;stroke-dasharray:11 5}.axis{stroke:#fa9e63;stroke-width:3;stroke-dasharray:8 7;fill:none}.good{fill:#75d1a7}.bad{fill:#ee8e7a}</style><text x="35" y="56" class="title">#87 • Уникальное оружие: силуэты для редизайна</text><text x="35" y="86" class="small">Предварительная концепция для обсуждения, не одобрение точного арт-дизайна. Цвет, силуэт, хват и 3D — проверять на масштабе Minecraft.</text><rect class="panel" x="30" y="118" width="505" height="399" rx="10"/><text x="49" y="157" class="h">КЛИНОК ТУГАРИНА</text><text x="49" y="188" class="small">Изогнутый тяжёлый профиль</text><g transform="translate(276 328)"><rect x="-8" y="47" width="16" height="93" class="wood"/><rect x="-45" y="47" width="90" height="18" class="gold"/><path d="M-9 48L-23 -38L-3 -137L31 -155L44 -132L26 -108L17 -40L13 48Z" class="iron"/><path d="M-3 -123 L17 -110 L7 40" class="axis"/></g><text x="48" y="484" class="small">На переработку только после фиксации текущего дефекта</text><rect class="panel" x="557" y="118" width="505" height="399" rx="10"/><text x="576" y="157" class="h">КИНЖАЛ СОЛОВЬЯ</text><text x="576" y="188" class="small">Тонкая асимметрия</text><g transform="translate(803 328)"><rect x="-8" y="47" width="15" height="90" class="wood"/><rect x="-31" y="44" width="58" height="13" class="purple"/><polygon points="-8,42 -18,-44 -2,-126 13,-86 16,-20 8,42" class="iron"/><path d="M-6 -30L8 1" class="axis"/></g><text x="575" y="484" class="small">На переработку только после фиксации текущего дефекта</text><rect class="panel" x="1084" y="118" width="505" height="399" rx="10"/><text x="1103" y="157" class="h">КОПЬЁ ПОБЕДИТЕЛЯ</text><text x="1103" y="188" class="small">Длинный стержень, копьё</text><g transform="translate(1330 328)"><rect x="-8" y="-128" width="16" height="252" class="wood"/><polygon points="-24,-114 0,-183 25,-114 15,-88 -15,-88" class="iron"/><rect x="-17" y="-94" width="34" height="19" class="gold"/></g><text x="1102" y="484" class="small">На переработку только после фиксации текущего дефекта</text><rect class="panel" x="30" y="543" width="505" height="399" rx="10"/><text x="49" y="582" class="h">ПОСОХ ЛИХО</text><text x="49" y="613" class="small">Кривое древко, глаз</text><g transform="translate(276 753)"><g><rect x="-11" y="-128" width="20" height="259" class="wood"/><path d="M-12 -120 L-28 -135 L-13 -168 L5 -176 L22 -159 L9 -145 L20 -126 L4 -110Z" class="purple"/><circle cx="2" cy="-148" r="8" fill="#a3c0c9"/></g></g><text x="48" y="909" class="small">На переработку только после фиксации текущего дефекта</text><rect class="panel" x="557" y="543" width="505" height="399" rx="10"/><text x="576" y="582" class="h">КОСА КАРАЧУНА</text><text x="576" y="613" class="small">Сохранить узнаваемый облик</text><g transform="translate(803 753)"><g><rect x="-9" y="-128" width="18" height="258" class="wood"/><path d="M-8 -119 L8 -130 L52 -132 L91 -105 L115 -73 L105 -54 L87 -83 L60 -108 L8 -109Z" class="iron"/><rect x="-12" y="-35" width="24" height="12" class="gold"/></g></g><text x="575" y="909" class="small">На переработку только после фиксации текущего дефекта</text><rect class="panel" x="1084" y="543" width="505" height="399" rx="10"/><text x="1103" y="582" class="h">КИСТЕНЬ АТАМАНА</text><text x="1103" y="613" class="small">Свисающий тяжёлый груз</text><g transform="translate(1330 753)"><rect x="-12" y="-80" width="24" height="140" class="wood"/><rect x="-18" y="-80" width="36" height="17" class="gold"/><path d="M0 60L8 83L9 109L17 138" class="chain"/><g><path d="M3 155 L20 140 L42 151 L45 175 L27 187 L-1 175Z" fill="#50566f" stroke="#b7c5c5" stroke-width="4"/><path d="M6 163 L34 163 M20 143 L24 182" stroke="#a3b0ba" stroke-width="3"/></g></g><text x="1102" y="909" class="small">На переработку только после фиксации текущего дефекта</text><text x="36" y="1010" class="small">Boss-контент: не менять способности, баланс, ID/лут. Понравившиеся элементы оригинального оружия сохранять.</text></svg>