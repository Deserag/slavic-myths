<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="990" viewBox="0 0 1450 990"><rect width="1450" height="990" fill="#142126"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#e9ebdd}.title{font-size:30px;font-weight:bold}.h{font-size:23px;font-weight:bold}.s{font-size:17px;fill:#b9c9c0}.frame{fill:#263337;stroke:#8da09e;stroke-width:2}.shaft{fill:#765139;stroke:#b99675;stroke-width:4}.blade{fill:#a3afb2;stroke:#d1dddb;stroke-width:4}.decor{fill:#52788d;stroke:#91c5d1;stroke-width:3}</style><text x="35" y="55" class="title">#87 • Семейства оружия и детали: чертёж силуэтов</text><text x="35" y="85" class="s">Референс-эскиз. Разные классы нельзя заменять перекраской единого шаблона. Не утверждённый игровой арт.</text><rect x="28" y="115" width="452" height="344" rx="8" class="frame"/><text x="46" y="153" class="h">МЕЧ</text><text x="46" y="186" class="s">Длинная прямая линия</text><g transform="translate(263 311)"><rect x="-11" y="42" width="22" height="94" class="shaft"/><rect x="-52" y="39" width="104" height="15" class="decor"/><path d="M-20 38L-16 -104L0 -163L16 -104L20 38Z" class="blade"/></g><text x="46" y="433" class="s">Отдельная UV/3D/GUI-модель по необходимости</text><rect x="503" y="115" width="452" height="344" rx="8" class="frame"/><text x="521" y="153" class="h">КИНЖАЛ</text><text x="521" y="186" class="s">Короткий острый силуэт</text><g transform="translate(738 311)"><rect x="-11" y="43" width="22" height="82" class="shaft"/><rect x="-32" y="35" width="64" height="14" class="decor"/><path d="M-18 35L-17 -42L0 -115L17 -42L18 35Z" class="blade"/></g><text x="521" y="433" class="s">Отдельная UV/3D/GUI-модель по необходимости</text><rect x="978" y="115" width="452" height="344" rx="8" class="frame"/><text x="996" y="153" class="h">ТОПОР / ЧЕКАН</text><text x="996" y="186" class="s">Голова отдельно от древка</text><g transform="translate(1213 311)"><rect x="-10" y="-116" width="20" height="236" class="shaft"/><path d="M-8 -111L-79 -113L-9