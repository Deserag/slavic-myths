<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#132023"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#e9e4d6} .title{font-size:31px;font-weight:bold}.h{font-size:21px;font-weight:bold}.small{font-size:15px;fill:#b7c3bd}.panel{fill:#203035;stroke:#718685;stroke-width:2}.wood{fill:#7a5032;stroke:#c9a17b;stroke-width:3}.iron{fill:#8799a0;stroke:#d3e2e2;stroke-width:3}.purple{fill:#515077;stroke:#a7a6e0;stroke-width:3}.gold{fill:#bb9a4e;stroke:#ead59a;stroke-width:3}.chain{stroke:#ccd2cf;stroke-width:8;stroke-linecap:square;stroke-dasharray:11 5}.axis{stroke:#fa9e63;stroke-width:3;stroke-dasharray:8 7;fill:none}.good{fill:#75d1a7}.bad{fill:#ee8e7a}</style><text x="35" y="56" class="title">#87 • Захват оружия игроком и длинное оружие</text><text x="35" y="86" class="small">Предлагаемый технический чертёж, НЕ реальный игровой рендер. Масштаб условный; проверка всегда по исходным моделям.</text><rect class="panel" x="30" y="117" width="320" height="640" rx="10"/><text x="46" y="155" class="h">НЕПРАВИЛЬНО</text><text x="46" y="190" class="small">Оружие лежит поверх предплечья</text><g transform="translate(190 392)"><g transform="translate(0 0)"><rect x="-47" y="-100" width="94" height="94" fill="#598474" stroke="#97afa3" stroke-width="4"/><rect x="-31" y="-8" width="62" height="104" fill="#d2a88c" stroke="#f3c8aa" stroke-width="4"/><rect x="-25" y="93" width="50" height="48" fill="#d2a88c" stroke="#f3c8aa" stroke-width="4"/></g><g transform="translate(54 52) rotate(-45)"><rect x="-9" y="-126" width="18" height="256" class="wood"/><polygon points="-10,-126 10,-126 20,-170 -5,-157" class="iron"/></g><circle cx="0" cy="118" r="26" fill="none" stroke="#ef8d7d" stroke-width="4"/></g><line x1="75" y1="690" x2="300" y2="690" class="axis"/><text x="51" y="728" class="small">Не допускать касания только по воздуху</text><rect class="panel" x="375" y="117" width="320" height="640" rx="10"/><text x="391" y="155" class="h">ПРАВИЛЬНО</text><text x="391" y="190" class="small">Ладонь охватывает рукоять</text><g transform="translate(535 395)"><g transform="translate(0 0)"><rect x="-47" y="-100" width="94" height="94" fill="#598474" stroke="#97afa3" stroke-width="4"/><rect x="-31" y="-8" width="62" height="104" fill="#d2a88c" stroke="#f3c8aa" stroke-width="4"/><rect x="-25" y="93" width="50" height="48" fill="#d2a88c" stroke="#f3c8aa" stroke-width="4"/></g><g transform="translate(0 103)"><rect x="-8" y="-114" width="16" height="215" class="wood"/><polygon points="-15,-114 15,-114 24,-180 -20,-178" class="iron"/></g><rect x="-27" y="103" width="54" height="38" fill="#d2a88c" stroke="#f3c8aa" stroke-width="3"/><path d="M-23 105L23 105M-23 121L23 121" stroke="#a46f58" stroke-width="3"/></g><line x1="420" y1="690" x2="645" y2="690" class="axis"/><text x="396" y="728" class="small">Опорная точка — внутри кисти</text><rect class="panel" x="720" y="117" width="320" height="640" rx="10"/><text x="736" y="155" class="h">КОСА: длинное оружие</text><text x="736" y="190" class="small">Стойка сбоку, клинок вдали от головы</text><g transform="translate(880 390)"><g transform="translate(0 0)"><rect x="-47" y="-100" width="94" height="94" fill="#598474" stroke="#97afa3" stroke-width="4"/><rect x="-31" y="-8" width="62" height="104" fill="#d2a88c" stroke="#f3c8aa" stroke-width="4"/><rect x="-25" y="93" width="50" height="48" fill="#d2a88c" stroke="#f3c8aa" stroke-width="4"/></g><g transform="translate(0 103)"><g><rect x="-9" y="-128" width="18" height="258" class="wood"/><path d="M-8 -119 L8 -130 L52 -132 L91 -105 L115 -73 L105 -54 L87 -83 L60 -108 L8 -109Z" class="iron"/><rect x="-12" y="-35" width="24" height="12" class="gold"/></g></g><rect x="-27" y="103" width="54" height="38" fill="#d2a88c" stroke="#f3c8aa" stroke-width="3"/><path d="M-23 105L23 105M-23 121L23 121" stroke="#a46f58" stroke-width="3"/></g><line x1="765" y1="690" x2="990" y2="690" class="axis"/><text x="741" y="728" class="small">Без пересечения голова/шея</text><rect class="panel" x="1065" y="117" width="320" height="640" rx="10"/><text x="1081" y="155" class="h">ПОСОХ: стандартный хват</text><text x="1081" y="190" class="small">Вертикально, кисть охватывает древко</text><g transform="translate(1225 390)"><g transform="translate(0 0)"><rect x="-47" y="-100" width="94" height="94" fill="#598474" stroke="#97afa3" stroke-width="4"/><rect x="-31" y="-8" width="62" height="104" fill="#d2a88c" stroke="#f3c8aa" stroke-width="4"/><rect x="-25" y="93" width="50" height="48" fill="#d2a88c" stroke="#f3c8aa" stroke-width="4"/></g><g transform="translate(0 103)"><g><rect x="-11" y="-128" width="20" height="259" class="wood"/><path d="M-12 -120 L-28 -135 L-13 -168 L5 -176 L22 -159 L9 -145 L20 -126 L4 -110Z" class="purple"/><circle cx="2" cy="-148" r="8" fill="#a3c0c9"/></g></g><rect x="-27" y="103" width="54" height="38" fill="#d2a88c" stroke="#f3c8aa" stroke-width="3"/><path d="M-23 105L23 105M-23 121L23 121" stroke="#a46f58" stroke-width="3"/></g><line x1="1110" y1="690" x2="1335" y2="690" class="axis"/><text x="1086" y="728" class="small">Обычная поза вне боя</text><rect x="30" y="780" width="1340" height="72" class="panel"/><text x="50" y="821" class="small">Проверка: 1P/3P спереди/сбоку/сзади, правая/левая рука, Alex/Steve, idle/walk/attack.</text><text x="36" y="872" class="small">Не распространять необычную стойку длинного оружия на короткие мечи, кинжалы, кистени, топоры.</text></svg>