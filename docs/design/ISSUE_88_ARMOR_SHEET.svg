<text x="41" y="746" class="title">ПРОВЕРКИ В ЧЕТЫРЁХ ВИДАХ, КОТОРЫЕ НЕЛЬЗЯ ПРОПУСКАТЬ</text>
<text x="48" y="792" class="head">1. Steve и Alex: настоящий renderer на обеих фигурах</text>
<text x="48" y="838" class="head">2. Иконка предмета ≠ надетая броня; проверка layer1/layer2</text>
<text x="48" y="884" class="head">3. Нет clipping, z-fighting, утраченных trims и неправильных UV</text>
<text x="48" y="930" class="head">4. Проверять idle, walk и поднятую руку, одна камера/масштаб</text>
<text x="41" y="978" class="note">Менять только дефектный item/model; размеры модели и пользовательские сохранения не изменять без отдельного согласования.</text>
