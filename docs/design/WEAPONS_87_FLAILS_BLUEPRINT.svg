<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#132023"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#e9e4d6} .title{font-size:31px;font-weight:bold}.h{font-size:21px;font-weight:bold}.small{font-size:15px;fill:#b7c3bd}.panel{fill:#203035;stroke:#718685;stroke-width:2}.wood{fill:#7a5032;stroke:#c9a17b;stroke-width:3}.iron{fill:#8799a0;stroke:#d3e2e2;stroke-width:3}.purple{fill:#515077;stroke:#a7a6e0;stroke-width:3}.gold{fill:#bb9a4e;stroke:#ead59a;stroke-width:3}.chain{stroke:#ccd2cf;stroke-width:8;stroke-linecap:square;stroke-dasharray:11 5}.axis{stroke:#fa9e63;stroke-width:3;stroke-dasharray:8 7;fill:none}.good{fill:#75d1a7}.bad{fill:#ee8e7a}</style><text x="35" y="56" class="title">#87 • Кистени: объёмная модель + естественное движение цепи</text><text x="35" y="86" class="small">Концепт: рукоять в кулаке, свободная цепь опускается вниз под тяжестью. Декоративный набросок, не физический симулятор.</text><rect class="panel" x="25" y="120" width="320" height="610" rx="10"/><text x="39" y="163" class="h">ОБЫЧНЫЙ: IDLE</text><text x="45" y="196" class="small">Шар ниже места подвеса</text><g><rect x="149" y="245" width="25" height="156" class="wood"/><rect x="144" y="245" width="34" height="13" class="gold"/><rect x="144" y="395" width="35" height="18" class="gold"/></g><path d="M162 415 L167 435 L164 461 L171 492 L174 526" class="chain"/><g><path d="M159 547 L176 532 L198 543 L201 567 L183 579 L155 567Z" fill="#7c8993" stroke="#b7c5c5" stroke-width="4"/><path d="M162 555 L190 555 M176 535 L180 574" stroke="#a3b0ba" stroke-width="3"/></g><text x="40" y="666" class="small">Детали: кубическая головка/шар</text><text x="40" y="693" class="small">и читаемые звенья, без парения</text><rect class="panel" x="370" y="120" width="320" height="610" rx="10"/><text x="384" y="163" class="h">АТАМАН: IDLE</text><text x="390" y="196" class="small">Более массивный, рельефный груз</text><g><rect x="494" y="245" width="25" height="156" class="wood"/><rect x="489" y="245" width="34" height="13" class="gold"/><rect x="489" y="395" width="35" height="18" class="gold"/></g><path d="M507 415 L512 435 L509 461 L516 492 L519 526" class="chain"/><g><path d="M504 547 L521 532 L543 543 L546 567 L528 579 L500 567Z" fill="#585b83" stroke="#b7c5c5" stroke-width="4"/><path d="M507 555 L535 555 M521 535 L525 574" stroke="#a3b0ba" stroke-width="3"/></g><text x="385" y="666" class="small">Детали: кубическая головка/шар</text><text x="385" y="693" class="small">и читаемые звенья, без парения</text><rect class="panel" x="715" y="120" width="320" height="610" rx="10"/><text x="729" y="163" class="h">ЗАМАХ: ANTICIPATION</text><text x="735" y="196" class="small">Цепь запаздывает за рукой</text><g><rect x="839" y="245" width="25" height="156" class="wood"/><rect x="834" y="245" width="34" height="13" class="gold"/><rect x="834" y="395" width="35" height="18" class="gold"/></g><path d="M852 410 Q897 515 966 495" class="chain"/><g><path d="M959 483 L976 468 L998 479 L1001 503 L983 515 L955 503Z" fill="#4e5d7e" stroke="#b7c5c5" stroke-width="4"/><path d="M962 491 L990 491 M976 471 L980 510" stroke="#a3b0ba" stroke-width="3"/></g><text x="730" y="666" class="small">Детали: кубическая головка/шар</text><text x="730" y="693" class="small">и читаемые звенья, без парения</text><rect class="panel" x="1060" y="120" width="320" height="610" rx="10"/><text x="1074" y="163" class="h">УДАР: FOLLOW-THROUGH</text><text x="1080" y="196" class="small">Груз уходит по инерции</text><g><rect x="1184" y="245" width="25" height="156" class="wood"/><rect x="1179" y="245" width="34" height="13" class="gold"/><rect x="1179" y="395" width="35" height="18" class="gold"/></g><path d="M1197 410 Q1290 350 1332 315" class="chain"/><g><path d="M1317 297 L1334 282 L1356 293 L1359 317 L1341 329 L1313 317Z" fill="#62648a" stroke="#b7c5c5" stroke-width="4"/><path d="M1320 305 L1348 305 M1334 285 L1338 324" stroke="#a3b0ba" stroke-width="3"/></g><path d="M1149 508Q1302 210 1382 295" class="axis"/><text x="1075" y="666" class="small">Детали: кубическая головка/шар</text><text x="1075" y="693" class="small">и читаемые звенья, без парения</text><text x="36" y="799" class="small">Состояния: idle / walk / start / swing / impact / return, обе руки. Реальная игровая проверка владельцем обязательна.</text></svg>