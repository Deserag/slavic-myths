// Plain JVM fixture: vanilla block registry bootstrap only; no client/server/world or NeoForge run.
allprojects {
 plugins.withId('java') {
  sourceSets {
   structures275Offline {
    java.srcDir 'tools/structures275-offline'
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
   }
  }
  tasks.register('verifyStructures275Offline',JavaExec) {
   dependsOn 'structures275OfflineClasses'
   classpath=sourceSets.structures275Offline.runtimeClasspath
   mainClass='org.slavicmyths.verify.Structures275Offline'
   maxHeapSize='384m'
   jvmArgs '-XX:ActiveProcessorCount=2'
   workingDir project.projectDir
  }
 }
}
