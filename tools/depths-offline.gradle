gradle.projectsEvaluated {
    def p = gradle.rootProject
    def compile = p.tasks.register('compileDepthsOffline', JavaCompile) {
        dependsOn p.tasks.named('compileJava')
        source p.fileTree('tools/depths-tests') { include '*.java' }
        classpath = p.sourceSets.main.compileClasspath + p.files(p.sourceSets.main.output.classesDirs)
        destinationDirectory.set(p.file('work/ancient-depths-1.5.3/native-offline-classes'))
        options.release.set(21)
        options.encoding = 'UTF-8'
    }
    def geometry = p.tasks.register('depthsGeometryOffline', JavaExec) {
        dependsOn compile
        classpath = p.sourceSets.main.compileClasspath + p.files(p.sourceSets.main.output.classesDirs, p.file('work/ancient-depths-1.5.3/native-offline-classes'))
        mainClass.set('DepthsOfflineChecks')
    }
    def persistence = p.tasks.register('depthsPersistenceOffline', JavaExec) {
        dependsOn geometry
        classpath = p.sourceSets.main.compileClasspath + p.files(p.sourceSets.main.output.classesDirs, p.file('work/ancient-depths-1.5.3/native-offline-classes'))
        mainClass.set('DepthsPersistenceOfflineChecks')
    }
    p.tasks.register('depthsOfflineChecks') { dependsOn persistence }
}
