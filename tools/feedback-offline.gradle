gradle.projectsEvaluated {
 def p=gradle.rootProject
 p.sourceSets { feedback { java.srcDir 'tools/feedback-offline' } }
 p.sourceSets.feedback.compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
 p.sourceSets.feedback.runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
 p.tasks.register('checkFeedbackOffline',JavaExec){dependsOn 'feedbackClasses';classpath=p.sourceSets.feedback.runtimeClasspath;mainClass='FeedbackChecks';if(p.hasProperty('feedbackOutput'))systemProperty 'slavicmyths.feedbackOutput',p.property('feedbackOutput')}
}
