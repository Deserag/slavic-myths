gradle.beforeProject { p -> p.layout.buildDirectory.set(p.file('work/chud-152/production-build')) }
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def compile = p.tasks.register('compileSearchOfflineChecks', JavaCompile) {
        dependsOn p.tasks.named('compileJava')
        source p.fileTree('tools/chud-search-tests') { include '*.java' }
        classpath = p.sourceSets.main.compileClasspath + p.files(p.sourceSets.main.output.classesDirs)
        destinationDirectory.set(p.file('work/chud-152/search-offline-classes'))
        options.release.set(21)
    }
    p.tasks.register('searchOfflineChecks', JavaExec) {
        dependsOn compile
        classpath = p.sourceSets.main.compileClasspath + p.files(p.sourceSets.main.output.classesDirs, p.file('work/chud-152/search-offline-classes'))
        mainClass.set('SearchOfflineChecks')
    }
}
