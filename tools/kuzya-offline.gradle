gradle.projectsEvaluated {
 def p=gradle.rootProject
 def compile=p.tasks.register('compileKuzyaOffline',JavaCompile){
  dependsOn p.tasks.named('compileJava')
  source p.fileTree('tools/kuzya-tests'){include '**/*.java'}
  source p.files('tools/kurgan-tests/org/slavicmyths/verify/YagaHeadless.java','tools/kurgan-tests/org/slavicmyths/verify/YagaPlacementHeadless.java')
  classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs)
  destinationDirectory.set(p.file('work/kuzya/offline-classes'))
  options.release.set(21);options.encoding='UTF-8'
 }
 p.tasks.register('kuzyaOfflineChecks',JavaExec){
  dependsOn compile
  classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs,p.file('work/kuzya/offline-classes'),p.file('tools/kuzya-test-resources'))
  mainClass.set('org.slavicmyths.client.KuzyaChecks')
 }
}
