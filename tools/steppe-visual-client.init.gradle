gradle.projectsEvaluated { def p=gradle.rootProject; p.neoForge.runs.client.gameDirectory=p.file('work/steppe-visual-client'); p.neoForge.runs.client.programArguments.addAll('--width','1280','--height','720'); p.neoForge.runs.client.systemProperty('steppe.visual.ids','polkan_spear,polkan_axe,polkan_bow,skarapeya_blade,skarapeya_whip,skarapeya_gusli,skarapeya_needle,steppe_spear') }





