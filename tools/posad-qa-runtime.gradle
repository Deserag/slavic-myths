allprojects { afterEvaluate {
 sourceSets { posadQa { java.srcDir 'tools/posad-runtime-tests'; resources.srcDir 'tools/posad-test-resources' } }
 if(project.findProperty('posadGuardOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/PosadGuardGameTests.java')
 if(project.findProperty('posadPhysicalOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/PosadShellGameTests.java')
 if(project.findProperty('posadFoodOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/PosadFoodGameTests.java')
 if(project.findProperty('viyOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/ViyGameTests.java')
 if(project.findProperty('posadProofOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/PosadTestPlayers.java','**/PosadProofGameTests.java')
 if(project.findProperty('posadNoiseOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/PosadNoiseGameTests.java')
 if(project.findProperty('posadSafetyOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/PosadTestPlayers.java','**/PosadBedGameTests.java','**/PosadRecoveryGameTests.java')
 if(project.findProperty('posadBedOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/PosadTestPlayers.java','**/PosadBedGameTests.java')
 if(project.findProperty('posadTradeOnly')=='true')sourceSets.posadQa.java.include('**/PosadQaMod.java','**/PosadTestPlayers.java','**/PosadTradeGameTests.java')
 if(project.findProperty('posadNoSurvey')=='true')sourceSets.posadQa.java.exclude('**/PosadNativeSurveyGameTests.java')
 if(project.findProperty('posadNoTrade')=='true')sourceSets.posadQa.java.exclude('**/PosadTradeGameTests.java')
 if(project.findProperty('posadCommandOnly')=='true')sourceSets.posadQa.java.exclude('**/PosadShellGameTests.java','**/PosadNativeSurveyGameTests.java')
 sourceSets.posadQa.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
 sourceSets.posadQa.runtimeClasspath += sourceSets.main.runtimeClasspath - sourceSets.main.output
 def qa=neoForge.mods.create('slavicmyths_posad'){sourceSet sourceSets.posadQa}
 neoForge.runs { posadQa {
  type='gameTestServer';sourceSet=sourceSets.posadQa;loadedMods.set([qa])
  jvmArgument '-Xmx1600M';jvmArgument '-XX:ActiveProcessorCount=2';jvmArgument '-Djava.awt.headless=true'
  gameDirectory=file(project.findProperty('posadQaDir') ?: 'work/posad-qa-20261030/run1')
  systemProperty 'neoforge.enabledGameTestNamespaces','slavicmyths_posad'
 } }
 def posadQaStarted=0L
 tasks.named('runPosadQa'){dependsOn tasks.named('jar');doFirst {
  posadQaStarted=System.currentTimeMillis()
  def dir=neoForge.runs.posadQa.gameDirectory.get().asFile
  def mods=new File(dir,'mods');mods.mkdirs()
  def jar=tasks.named('jar').get().archiveFile.get().asFile
  copy {from jar;into mods}
  new File(dir,'server.properties').text='server-ip=127.0.0.1\nserver-port=25589\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\nlevel-seed=20261024\nmax-players=2\n'
 };doLast {
  def runtimeLog=new File(neoForge.runs.posadQa.gameDirectory.get().asFile,'logs/latest.log')
  if(!runtimeLog.isFile()||runtimeLog.lastModified()<posadQaStarted||!(runtimeLog.text =~ /All [0-9]+ required tests passed/).find())throw new GradleException('Posad GameTest runtime did not report all required tests passed; inspect logs/latest.log')
 }}
} }
