allprojects { p ->
 p.plugins.withId('java') {
  p.sourceSets.create('armor88Full') { java.srcDir('tools/armor88-full-offline') }
  p.sourceSets.armor88Full.compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
  p.sourceSets.armor88Full.runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
  p.tasks.register('exportArmor88Full', JavaExec) {
   dependsOn p.tasks.named('armor88FullClasses')
   classpath = p.sourceSets.armor88Full.runtimeClasspath
   mainClass = 'org.slavicmyths.client.Armor88FullMeshes'
   args = [p.file(p.findProperty('armor88Out') ?: 'docs/implementation/armor88-full/after-native.json').absolutePath]
  }
 }
}
