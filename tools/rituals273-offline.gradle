allprojects {
 plugins.withId('java') {
  sourceSets {
   rituals273Offline {
    java.srcDir 'tools/rituals273-offline'
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
   }
  }
  tasks.register('verifyRituals273Offline',JavaExec) {
   dependsOn 'rituals273OfflineClasses'
   classpath=sourceSets.rituals273Offline.runtimeClasspath
   mainClass='org.slavicmyths.verify.Rituals273Offline'
   maxHeapSize='384m'
   jvmArgs '-XX:ActiveProcessorCount=2'
  }
 }
}
