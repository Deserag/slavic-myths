  classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs)
  destinationDirectory.set(p.file('work/armor-revision/offline-classes'));options.release.set(21);options.encoding='UTF-8'
 }
 p.tasks.register('armorRevisionOffline',JavaExec){
