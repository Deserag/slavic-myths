allprojects { afterEvaluate {
 sourceSets { bossAudit { java.srcDir 'tools/boss-audit/runtime';resources.srcDir 'tools/boss-audit/resources' } }
 if(project.findProperty('bossAuditProjectileOnly')=='true')sourceSets.bossAudit.java.include('BossAuditMod.java','AuditPlayers.java','ProjectileAudit.java','PartnerAudit.java')
 if(project.findProperty('bossAuditStressOnly')=='true')sourceSets.bossAudit.java.include('BossAuditMod.java','AuditPlayers.java','InterruptionAudit.java','AiStressAudit.java')
 sourceSets.bossAudit.compileClasspath += sourceSets.main.output+sourceSets.main.compileClasspath
 sourceSets.bossAudit.runtimeClasspath += sourceSets.main.runtimeClasspath-sourceSets.main.output
 def qa=neoForge.mods.create('slavicmyths_bossaudit'){sourceSet sourceSets.bossAudit}
 neoForge.runs { bossAudit {type='gameTestServer';sourceSet=sourceSets.bossAudit;loadedMods.set([qa]);gameDirectory=file(project.findProperty('bossAuditDir') ?: 'work/boss-audit/runtime1');jvmArgument '-Xmx1800M';jvmArgument '-XX:ActiveProcessorCount=2';jvmArgument '-Djava.awt.headless=true';systemProperty 'neoforge.enabledGameTestNamespaces','slavicmyths_bossaudit';systemProperty 'bossaudit.output',file('work/boss-audit/evidence').absolutePath} }
 neoForge.runs { bossAuditDedicated {type='server';sourceSet=sourceSets.bossAudit;loadedMods.set([qa]);programArgument '--nogui';gameDirectory=file(project.findProperty('bossAuditDir') ?: 'work/boss-audit/dedicated');jvmArgument '-Xmx1800M';jvmArgument '-XX:ActiveProcessorCount=2';jvmArgument '-Djava.awt.headless=true';systemProperty 'bossaudit.dedicated','true';systemProperty 'bossaudit.stressName',(project.findProperty('bossAuditStressName') ?: (project.findProperty('bossAuditLegalPressure')=='true'?'dedicated-legal-pressure':'dedicated-stress'));systemProperty 'bossaudit.legalPressure',(project.findProperty('bossAuditLegalPressure') ?: 'false');systemProperty 'bossaudit.ids',(project.findProperty('bossAuditIds') ?: 'gneteya,tryaseya,agneya,ledeya,lomeya,neveya,viy,morovoy_raven,morovoy_fire_zmey,nine_mor_serpent,cursed_mytar,bauk');systemProperty 'bossaudit.output',file('work/boss-audit/evidence').absolutePath} }
 tasks.named('runBossAuditDedicated'){dependsOn tasks.named('jar');doFirst{def d=neoForge.runs.bossAuditDedicated.gameDirectory.get().asFile;d.mkdirs();copy{from tasks.named('jar').get().archiveFile;into new File(d,'mods')};new File(d,'eula.txt').text='eula=true\n';new File(d,'server.properties').text='server-ip=127.0.0.1\nserver-port=25595\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nlevel-type=minecraft:flat\nmax-tick-time=180000\n'};doLast{def receipt=file('work/boss-audit/evidence/'+(project.findProperty('bossAuditStressName') ?: (project.findProperty('bossAuditLegalPressure')=='true'?'dedicated-legal-pressure':'dedicated-stress'))+'.result');if(!receipt.isFile()||receipt.text!='COLLECTION_COMPLETED')throw new GradleException('Dedicated audit collection incomplete')} }
 neoForge.runs { bossAuditPerformance {type='server';sourceSet=sourceSets.bossAudit;loadedMods.set([qa]);programArgument '--nogui';gameDirectory=file(project.findProperty('bossAuditDir') ?: 'work/boss-audit/performance');jvmArgument '-Xmx1800M';jvmArgument '-XX:ActiveProcessorCount=2';jvmArgument '-Djava.awt.headless=true';systemProperty 'bossaudit.performance','true';systemProperty 'bossaudit.output',file('work/boss-audit/evidence').absolutePath} }
 tasks.named('runBossAuditPerformance'){dependsOn tasks.named('jar');doFirst{def d=neoForge.runs.bossAuditPerformance.gameDirectory.get().asFile;d.mkdirs();copy{from tasks.named('jar').get().archiveFile;into new File(d,'mods')};new File(d,'eula.txt').text='eula=true\n';new File(d,'server.properties').text='server-ip=127.0.0.1\nserver-port=25596\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nlevel-type=minecraft:flat\nmax-tick-time=180000\n'};doLast{def receipt=file('work/boss-audit/evidence/server-performance.result');if(!receipt.isFile()||receipt.text!='COLLECTION_COMPLETED')throw new GradleException('Performance collection incomplete')} }
 neoForge.runs {bossAuditRestart {type='server';sourceSet=sourceSets.bossAudit;loadedMods.set([qa]);programArgument '--nogui';gameDirectory=file(project.findProperty('bossAuditDir') ?: 'work/boss-audit/restart');jvmArgument '-Xmx1800M';jvmArgument '-XX:ActiveProcessorCount=2';jvmArgument '-Djava.awt.headless=true';systemProperty 'bossaudit.restart','true';systemProperty 'bossaudit.output',file('work/boss-audit/evidence').absolutePath} }
 tasks.named('runBossAuditRestart'){dependsOn tasks.named('jar');doFirst{def d=neoForge.runs.bossAuditRestart.gameDirectory.get().asFile;d.mkdirs();copy{from tasks.named('jar').get().archiveFile;into new File(d,'mods')};new File(d,'eula.txt').text='eula=true\n';new File(d,'server.properties').text='server-ip=127.0.0.1\nserver-port=25597\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nlevel-type=minecraft:flat\nmax-tick-time=180000\n'};doLast{if(!file('work/boss-audit/evidence/restart-write.result').isFile())throw new GradleException('Restart write did not complete')} }
 def started=0L
 tasks.named('runBossAudit'){dependsOn tasks.named('jar');doFirst {started=System.currentTimeMillis();def d=neoForge.runs.bossAudit.gameDirectory.get().asFile;d.mkdirs();copy{from tasks.named('jar').get().archiveFile;into new File(d,'mods')};new File(d,'server.properties').text='server-ip=127.0.0.1\nserver-port=25594\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=180000\n'};doLast{def log=new File(neoForge.runs.bossAudit.gameDirectory.get().asFile,'logs/latest.log');if(!log.isFile()||log.lastModified()<started||!(log.text =~ /All [0-9]+ required tests passed/).find())throw new GradleException('Boss audit runtime did not PASS; inspect latest.log')} }
} }
