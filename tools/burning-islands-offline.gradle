allprojects { p ->
 p.plugins.withId('java') {
  p.sourceSets.create('islandsOffline') { java.srcDirs('tools/burning-islands-tests','tools/heads140-offline') }
  p.sourceSets.islandsOffline.compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
  p.sourceSets.islandsOffline.runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
  p.tasks.register('verifyLegacyHeadsRegression',JavaExec) {
   dependsOn p.tasks.named('islandsOfflineClasses')
   classpath=p.sourceSets.islandsOffline.runtimeClasspath
   mainClass='org.slavicmyths.client.Heads140Offline'
  }
  p.tasks.register('verifyOceanTerrain',JavaExec) {
   dependsOn p.tasks.named('islandsOfflineClasses')
   classpath=p.sourceSets.islandsOffline.runtimeClasspath
   mainClass='org.slavicmyths.verify.OceanTerrainAudit'
  }
  p.tasks.register('auditBurningIslandsOcean',JavaExec) {
   dependsOn p.tasks.named('islandsOfflineClasses')
   classpath=p.sourceSets.islandsOffline.runtimeClasspath
   mainClass='org.slavicmyths.verify.IslandsOceanAudit'
  }
  p.tasks.register('verifyBurningIslandsOffline',JavaExec) {
   dependsOn p.tasks.named('islandsOfflineClasses')
   classpath=p.sourceSets.islandsOffline.runtimeClasspath
   mainClass='org.slavicmyths.verify.IslandsOffline'
  }
 }
}
