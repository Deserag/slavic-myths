gradle.projectsEvaluated {
 def p=gradle.rootProject
 def compile=p.tasks.register('compileBogatyr78Checks',JavaCompile){
  dependsOn p.tasks.named('compileJava')
  source p.fileTree('tools/bogatyr78-native'){include '**/*.java'}
  source p.file('tools/skim77-native/Skim77Native.java')
  classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs)
  destinationDirectory.set(p.file('work/bogatyr78/classes'));options.release.set(21);options.encoding='UTF-8'
 }
 p.tasks.register('bogatyr78Checks',JavaExec){dependsOn compile;classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs,p.file('work/bogatyr78/classes'),p.file('tools/kuzya-test-resources'));mainClass.set('Bogatyr78Checks')}
}
