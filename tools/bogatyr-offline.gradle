gradle.projectsEvaluated {
 def p=gradle.rootProject
 def compile=p.tasks.register('compileBogatyrOffline',JavaCompile){
  dependsOn p.tasks.named('compileJava');source p.fileTree('tools/bogatyr-tests'){include '**/*.java'}
  classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs)
  destinationDirectory.set(p.file('work/bogatyr/offline-classes'));options.release.set(21);options.encoding='UTF-8'
 }
 p.tasks.register('bogatyrOfflineChecks',JavaExec){dependsOn compile;classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs,p.file('work/bogatyr/offline-classes'),p.file('tools/kuzya-test-resources'));mainClass.set('org.slavicmyths.client.BogatyrChecks')}
}
