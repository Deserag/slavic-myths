gradle.beforeProject { p -> p.plugins.withId('net.neoforged.moddev') {
 p.sourceSets { scytheClient { java.srcDir 'tools/smoke/scythe-client' } }
 p.sourceSets.scytheClient.compileClasspath += p.sourceSets.main.output+p.sourceSets.main.compileClasspath
 p.sourceSets.scytheClient.runtimeClasspath += p.sourceSets.main.runtimeClasspath
 p.tasks.named('compileScytheClientJava') { dependsOn p.tasks.named('classes') }
 p.neoForge.mods.maybeCreate('slavicmyths').sourceSet(p.sourceSets.scytheClient)
} }
gradle.projectsEvaluated { def p=gradle.rootProject;p.neoForge.runs.client.gameDirectory=p.file('work/scythe-client');p.neoForge.runs.client.programArguments.addAll('--width','1280','--height','720') }
