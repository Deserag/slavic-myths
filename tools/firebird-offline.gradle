gradle.projectsEvaluated {
 def p=gradle.rootProject
 def compile=p.tasks.register('compileFirebirdOffline',JavaCompile){
  dependsOn p.tasks.named('compileJava')
  source p.fileTree('tools/firebird-tests'){include '**/*.java'}
  classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs)
  destinationDirectory.set(p.file('work/firebird/offline-classes'))
  options.release.set(21);options.encoding='UTF-8'
 }
 p.tasks.register('firebirdOfflineChecks',JavaExec){
  dependsOn compile
  classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs,p.file('work/firebird/offline-classes'))
  mainClass.set('org.slavicmyths.firebird.FirebirdChecks')
 }
}
