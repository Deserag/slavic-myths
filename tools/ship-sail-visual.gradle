allprojects { afterEvaluate {
  sourceSets {
    shipSailVisual {
      java.srcDir 'tools/ship-sail-visual'
      resources.srcDir 'tools/ship-sail-visual-resources'
    }
  }
  sourceSets.shipSailVisual.compileClasspath +=
      sourceSets.main.output + sourceSets.main.compileClasspath
  sourceSets.shipSailVisual.runtimeClasspath +=
      sourceSets.main.runtimeClasspath - sourceSets.main.output
  def qa = neoForge.mods.create('slavicmyths_shipsailvisual') {
    sourceSet sourceSets.shipSailVisual
  }
  neoForge.runs {
    shipSailVisual {
      type = 'client'
      sourceSet = sourceSets.shipSailVisual
      loadedMods.set([qa])
      gameDirectory = file('work/ship-sail-visual-isolated')
      if (project.findProperty('shipSailMp') == 'guest')
        gameDirectory = file('work/ship-sail-visual-guest-isolated')
      if (project.findProperty('shipSailMp') == 'guest')
        programArguments.addAll('--username', 'ShipQASecond')
      programArguments.addAll('--width','1600','--height','1000')
      jvmArgument '-Xmx3G'
      jvmArgument '-XX:ActiveProcessorCount=2'
      systemProperty 'shipsailvisual.output',
          file('build/ship-sail-visual/frames').absolutePath
      systemProperty 'shipsailvisual.relog',
          (project.findProperty('shipSailRelog') ?: 'false').toString()
      if (project.hasProperty('shipSailMp'))
        systemProperty 'shipsailvisual.multiplayer', project.property('shipSailMp').toString()
    }
  }
  tasks.named('runShipSailVisual') {
    dependsOn tasks.named('jar')
    doFirst {
      if (System.getenv('GITHUB_ACTIONS') != 'true'
              || System.getenv('RUNNER_ENVIRONMENT') != 'github-hosted')
        throw new GradleException(
            'Never run visual QA on the owner desktop; GitHub-hosted isolation required.')
      def dir = neoForge.runs.shipSailVisual.gameDirectory.get().asFile
      dir.mkdirs()
      copy {
        from tasks.named('jar').get().archiveFile
        into new File(dir, 'mods')
      }
    }
    doLast {
      if (project.hasProperty('shipSailMp')) {
        def role = project.property('shipSailMp').toString()
        def receipt = file("build/ship-sail-visual/multiplayer/${role}.json")
        if (!receipt.isFile() || !receipt.text.contains('PASS_TWO_REAL_CLIENTS'))
          throw new GradleException("Ship ${role} multiplayer proof missing")
      } else if (project.hasProperty('shipSailRelog')) {
        def receipt = file('build/ship-sail-visual/frames/finished.json')
        if (!receipt.isFile() ||
            !receipt.text.contains('CAPTURE_COMPLETE_NOT_OWNER_ACCEPTANCE'))
          throw new GradleException('Ship relog receipt missing or incomplete')
      } else if (!file('build/ship-sail-visual/frames/checkpoint.json').isFile())
        throw new GradleException('Ship relog checkpoint missing')
    }
  }
} }
