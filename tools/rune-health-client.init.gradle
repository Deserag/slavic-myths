gradle.beforeProject { p -> p.plugins.withId('net.neoforged.moddev') {
 p.sourceSets { runeHealthClient { java.srcDir 'tools/rune-health-client' } }
 p.sourceSets.runeHealthClient.compileClasspath += p.sourceSets.main.output+p.sourceSets.main.compileClasspath
 p.sourceSets.runeHealthClient.runtimeClasspath += p.sourceSets.main.runtimeClasspath
 p.tasks.named('compileRuneHealthClientJava') { dependsOn p.tasks.named('classes') }
 p.neoForge.mods.maybeCreate('slavicmyths').sourceSet(p.sourceSets.runeHealthClient)
} }
gradle.projectsEvaluated { def p=gradle.rootProject;p.neoForge.runs.client.gameDirectory=p.file('work/rune-health-48');if(p.hasProperty('runeHealthInventoryOnly'))p.neoForge.runs.client.systemProperty('runeHealthInventoryOnly','true');p.neoForge.runs.client.programArguments.addAll('--width','1280','--height','900') }
