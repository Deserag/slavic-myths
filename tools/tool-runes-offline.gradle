gradle.projectsEvaluated {
 def p=gradle.rootProject
 def compile=p.tasks.register('compileToolRunesOffline',JavaCompile){
  dependsOn p.tasks.named('classes')
  source p.fileTree('tools/tool-rune-tests'){include '*.java'}
  classpath=p.sourceSets.main.compileClasspath+p.files(p.sourceSets.main.output.classesDirs)
  destinationDirectory.set(p.file('work/tool-runes-offline'))
  options.release.set(21);options.encoding='UTF-8'
 }
 p.tasks.register('toolRunesOfflineChecks',JavaExec){
  dependsOn compile
  classpath=p.sourceSets.main.runtimeClasspath+p.files(p.file('work/tool-runes-offline'))
  mainClass.set('ToolRunesOffline')
 }
}
