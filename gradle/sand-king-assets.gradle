// Gradle 9: use a typed Exec task instead of the removed Project.exec method.
def sandKingAssetRoot = layout.buildDirectory.dir('generated/sand-king-resources')
def sandKingGeometryPath = 'assets/slavicmyths/sand_king/geometry.bin.gz'
def sandKingSoundPath = 'assets/slavicmyths/sounds/desert/sand_king'
def sandKingNames = ['ambient','alert','hurt','death','step','sting','poison','claw','jump','land','slam_charge','slam','rage']
def sandKingPython = providers.environmentVariable('SAND_KING_PYTHON').orElse(System.getProperty('os.name').toLowerCase().contains('win') ? 'python' : 'python3')
def generateSandKingAssets = tasks.register('generateSandKingAssets', Exec) {
    inputs.files(fileTree('tools/sand_king') { include '*.py', 'requirements.txt' })
    inputs.files(files("src/main/resources/${sandKingGeometryPath}", sandKingNames.collect { "src/main/resources/${sandKingSoundPath}/${it}.ogg" }))
    inputs.property('pythonExecutable', sandKingPython)
    outputs.dir(sandKingAssetRoot)
    workingDir rootProject.projectDir
    environment 'SAND_KING_RESOURCE_ROOT', sandKingAssetRoot.get().asFile.absolutePath
    commandLine sandKingPython.get(), 'tools/sand_king/generate_assets.py'
}
tasks.named('processResources') {
    dependsOn generateSandKingAssets
    from(sandKingAssetRoot)
}
