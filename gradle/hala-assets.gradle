def halaRoot = layout.buildDirectory.dir('generated/hala-resources')
def halaPython = providers.environmentVariable('SAND_KING_PYTHON').orElse(System.getProperty('os.name').toLowerCase().contains('win') ? 'python' : 'python3')
def generateHalaAssets = tasks.register('generateHalaAssets', Exec) {
    inputs.files(fileTree('tools/hala') { include '*.py' })
    inputs.property('pythonExecutable', halaPython)
    outputs.dir(halaRoot)
    workingDir rootProject.projectDir
    environment 'HALA_RESOURCE_ROOT', halaRoot.get().asFile.absolutePath
    commandLine halaPython.get(), 'tools/hala/export_assets.py'
}
tasks.named('processResources') {
    dependsOn generateHalaAssets
    from(halaRoot)
}
