name: Generate 2D Sister Relic Resources
on:
  push:
    branches: [2.5-armor-bow-loot-polish-20261109]
    paths:
      - tools/generate_sister_artifacts_2d.py
      - .github/workflows/generate-sister-relic-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/generate_sister_artifacts_2d.py
      - run: python tools/generate_sister_artifacts_2d.py --check
      - name: Commit generated images and their model definitions to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/slavicmyths/models/item/sisters_ring.json
          git add src/main/resources/assets/slavicmyths/models/item/sisters_necklace.json
          git add src/main/resources/assets/slavicmyths/models/item/sisters_belt.json
          git add src/main/resources/assets/slavicmyths/models/item/sisters_crown.json
          git add src/main/resources/assets/slavicmyths/models/item/sisters_brooch.json
          git add src/main/resources/assets/slavicmyths/models/item/sisters_artifacts/
          git add src/main/resources/assets/slavicmyths/textures/item/sisters_artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "Generate 2D Slavic sister relic pixel art and blessing variants"
            git push origin HEAD:2.5-armor-bow-loot-polish-20261109
          fi
