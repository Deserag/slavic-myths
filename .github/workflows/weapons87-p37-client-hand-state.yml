name: Weapons87 P37 Hand State Java21
on:
  push:
    branches:
      - fix/weapons87-p37-client-hand-state
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Regression tests
        run: |
          python3 tools/verify_weapons87_p37.py
          python3 tools/verify_weapons87_crossbow_realstack.py
          python3 tools/verify_weapons87_crossbow_recoil.py
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --console=plain
      - name: Verify jar
        run: |
          python3 tools/verify_weapons87_crossbow_recoil.py --jar
          python3 tools/weapons87_live_audit.py --jar
