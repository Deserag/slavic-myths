name: Tsar Pike - Java 21 and ocean compatibility

on:
  push:
    branches: [integration/ocean-updates]
    paths:
      - ".github/workflows/ocean-tsar-pike.yml"
      - "tools/pharaohka-tests/org/slavicmyths/marine/TsarPikeGameTests.java"
      - "src/main/java/org/slavicmyths/marine/TsarPike*.java"
      - "src/main/java/org/slavicmyths/client/TsarPike*.java"
      - "src/main/java/org/slavicmyths/SlavicMyths.java"
      - "src/main/java/org/slavicmyths/client/ClientSetup.java"
      - "src/main/resources/data/slavicmyths/neoforge/biome_modifier/tsar_pike_spawns.json"
      - "src/main/resources/data/slavicmyths/tags/worldgen/biome/spawn_tsar_pike.json"
      - "tools/ocean/verify_food_and_sisters.py"
      - "src/main/resources/assets/slavicmyths/creative_catalog.tsv"
      - "src/main/resources/assets/slavicmyths/models/item/**"
      - "src/main/resources/assets/slavicmyths/textures/item/**"
      - "src/main/java/org/slavicmyths/client/SistersModel.java"
      - "src/main/java/org/slavicmyths/kitchen/KitchenII.java"
      - "src/main/java/org/slavicmyths/client/SistersRenderer.java"
      - "src/main/resources/assets/slavicmyths/textures/entity/tryaseya*"
      - "src/main/resources/assets/slavicmyths/textures/entity/gneteya*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check creative food registrations and sister assets
        run: python3 tools/ocean/verify_food_and_sisters.py
      - name: Compile and assemble NeoForge mod
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --console=plain
      - name: Run isolated aquatic-boss GameTests
        run: ./gradlew -PpharaohkaCheck runPharaohkaTests --no-daemon --console=plain
      - name: Archive test JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tsar-pike-test-jar
          path: build/libs/slavicmyths-*.jar
          if-no-files-found: error
          retention-days: 7
