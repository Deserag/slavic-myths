name: Morovoy Fire Zmey #396 Java 21
on:
  push:
    branches:
      - feat/2.3.2-morovoy-fire-zmey-396-20261101
  pull_request:
    branches: [2.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run isolated combat-window smoke
        run: |
          mkdir -p build/zmey396
          javac -encoding UTF-8 -d build/zmey396 src/main/java/org/slavicmyths/morovoy/MorovoyZmeyRules.java tools/qa/MorovoyZmeyRulesSmoke.java
          java -cp build/zmey396 org.slavicmyths.morovoy.MorovoyZmeyRulesSmoke
      - name: Java 21 clean NeoForge production build
        run: chmod +x gradlew && ./gradlew --no-daemon clean build --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: morovoy-zmey-396-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
