name: Weapons87 owner feedback crossbow/Kalin/Thunder Java21
on:
  push:
    branches:
      - feat/weapons87-owner-qa-crossbow-kalin-thunder
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Regression checks for all twelve crossbow states and melee triggers
        run: |
          python3 tools/weapons87_owner_qa.py
          python3 tools/verify_weapons87_crossbows.py
          python3 tools/verify_weapons87_thunderaxe.py
      - name: Java21 NeoForge clean build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Verify packaged item models and exact Java21 JAR
        run: |
          python3 tools/weapons87_owner_qa.py --jar
          python3 tools/verify_weapons87_crossbows.py
          sha256sum build/libs/slavicmyths-*.jar
      - name: Render factual source old vs new from actual model/UV
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 tools/weapons87_owner_qa.py --render
      - name: Publish source A/B and JAR
        uses: actions/upload-artifact@v4
        with:
          name: weapons87-owner-feedback-crossbow-kalin-thunder
          path: |
            docs/implementation/weapons87/owner-qa-20261022/ci-source-views/*.png
            build/libs/slavicmyths-*.jar
          retention-days: 14
