name: 'Issue 389 — 2.2 boss static validation and Java 21 build'
on:
  push:
    branches:
      - fix/2.2-389-boss-rework-20261101
  pull_request:
    branches:
      - '2.2'
  workflow_dispatch:
concurrency:
  group: issue389-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate all PNGs, JSONs, 3D rigs, runes, and Curios slots
        run: python3 tools/qa_389_assets.py
      - name: Clean Java 21 NeoForge build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --console=plain 2>&1 | tee issue389-build.log
      - name: Isolated NeoForge #389 boss GameTests (Java 21)
        shell: bash
        run: |
          set -o pipefail
          timeout 12m ./gradlew --no-daemon -Pboss389Check runBoss389Checks --console=plain 2>&1 | tee issue389-gametests.log
      - name: Record source and built artifact SHA
        if: success()
        shell: bash
        run: |
          git rev-parse HEAD > issue389-source-sha.txt
          sha256sum build/libs/slavicmyths-*.jar > issue389-jar-sha256.txt
      - name: Preserve build evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue389-build-evidence
          path: |
            issue389-build.log
            issue389-gametests.log
            issue389-source-sha.txt
            issue389-jar-sha256.txt
            build/reports/
          retention-days: 14

  packaged-client-visual:
    needs: compile-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Xvfb and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1
      - name: Isolated packaged-Minecraft framebuffer screenshots (no owner desktop)
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          xvfb-run -a -s '-screen 0 1600x1000x24' sh -c 'glxinfo -B; timeout 15m ./gradlew --no-daemon -I tools/hell-visual-qa.gradle runHellVisualQa -PhellVisualScope=boss389 -PhellVisualModel=slim --console=plain' 2>&1 | tee issue389-client.log
          test -f build/hell-visual-qa/frames/finished.json
      - name: Preserve actual screenshots and framebuffer metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue389-isolated-client-visual
          path: |
            issue389-client.log
            build/hell-visual-qa/frames/
            work/hell-visual-qa-isolated/logs/
          retention-days: 14
