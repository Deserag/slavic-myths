name: Weapons87 Continuous Branch Java21
on:
  push:
    branches:
      - work/weapons87-continuous-20261022
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Continuous workbench P42 source and generator checks
        run: |
          python3 tools/verify_weapons87_p42.py
          python3 tools/verify_weapons87_p43.py
          python3 tools/verify_weapons87_p44.py
          python3 tools/verify_weapons87_p45.py
          python3 tools/verify_weapons87_p47.py
          python3 tools/verify_weapons87_p41.py
          python3 tools/weapons87_unique_art.py --check
      - name: Java21 clean build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Check packaged P42 item resources
        run: |
          python3 tools/verify_weapons87_p42.py --jar
          python3 tools/verify_weapons87_p43.py --jar
          python3 tools/verify_weapons87_p44.py --jar
          python3 tools/verify_weapons87_p45.py --jar
          python3 tools/verify_weapons87_p47.py --jar
          python3 tools/weapons87_live_audit.py --jar
          sha256sum build/libs/slavicmyths-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: weapons87-continuous-build
          path: build/libs/slavicmyths-*.jar
          retention-days: 14
