name: Polkan savanna validation
on:
  push:
    branches: ['feature/savanna-biome-20261126']
    paths: ['src/**', '.github/workflows/polkan-savanna-validation.yml', 'build.gradle', 'gradle.properties']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset generation dependencies
        run: python -m pip install numpy scipy soundfile pillow matplotlib opencv-python-headless
      - run: chmod +x gradlew
      - run: ./gradlew clean build --no-daemon
      - name: Run savanna Polkan and Div GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PpolkanCheck runPolkanTests --no-daemon --console=plain 2>&1 | tee /tmp/polkan-gametest.log
          if grep -Eiq 'Duplicate registration|Failed to create mod instance|Mod loading failed|Failed to load correctly|ExceptionInInitializerError|broken mod state|Failed to start the minecraft server' /tmp/polkan-gametest.log; then
            exit 1
          fi
          grep -Eiq 'All ([4-9]|[1-9][0-9]+) required tests passed' /tmp/polkan-gametest.log
