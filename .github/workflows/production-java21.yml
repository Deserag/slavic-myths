name: Production Java 21
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Clean production build
        run: chmod +x gradlew && ./gradlew --no-daemon clean build --console=plain
      - name: Resource and production JAR integrity
        run: python tools/verify_current_resources.py
      - name: Book regression without starting Minecraft
        run: ./gradlew --no-daemon -I tools/book-offline.gradle checkBookOffline --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: production-java21-jar
          path: build/libs/slavicmyths-*.jar
          if-no-files-found: error
          retention-days: 14
