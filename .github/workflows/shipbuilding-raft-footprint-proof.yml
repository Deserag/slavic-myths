name: Shipbuilding 2.6 - raft footprint proof

on:
  push:
    paths:
      - "src/main/java/org/slavicmyths/ships/RaftFootprint.java"
      - "src/main/java/org/slavicmyths/ships/RaftSize.java"
      - "experimental/raft26/RaftFootprintProof.java"
      - ".github/workflows/shipbuilding-raft-footprint-proof.yml"
  pull_request:
    paths:
      - "src/main/java/org/slavicmyths/ships/RaftFootprint.java"
      - "src/main/java/org/slavicmyths/ships/RaftSize.java"
      - "experimental/raft26/RaftFootprintProof.java"
      - ".github/workflows/shipbuilding-raft-footprint-proof.yml"

jobs:
  footprint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile pure JDK21 geometry
        run: |
          mkdir -p build/raft-placement-proof
          javac -encoding UTF-8 -d build/raft-placement-proof src/main/java/org/slavicmyths/ships/RaftSize.java src/main/java/org/slavicmyths/ships/RaftFootprint.java experimental/raft26/RaftFootprintProof.java
      - name: Verify complete rotated raft footprints
        run: java -ea -cp build/raft-placement-proof org.slavicmyths.ships.RaftFootprintProof
