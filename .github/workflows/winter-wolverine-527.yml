name: Winter Wolverine 527 - Java 21 build and isolated GameTests
on:
  push:
    branches: ['feature/winter-wolverine-boss-20261123', 'fix/winter-wolverine-model-20261123', 'feature/ocean-rewards-completion-20261120']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wolverine:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Java 21 clean build
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --console=plain
      - name: Compile isolated Wolverine GameTests
        run: ./gradlew -PwolverineCheck compileWolverineCheckJava --no-daemon --console=plain
      - name: Run five native Wolverine GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PwolverineCheck runWolverineTests --no-daemon --console=plain 2>&1 | tee /tmp/wolverine-gametests.log
          if grep -Eqi 'Failed to start the minecraft server|ModLoadingCrashException|GameTest.*failed|[0-9]+ required tests failed' /tmp/wolverine-gametests.log; then exit 1; fi
          grep -Eq 'All [0-9]+ required tests passed' /tmp/wolverine-gametests.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northern-wolverine-qa
          path: |
            build/reports/
            build/libs/
            /tmp/wolverine-gametests.log
          if-no-files-found: warn
          retention-days: 10
