name: Integrated release - Ships, Pharaohka, Buyan (Java 21)

on:
  push:
    branches:
      - integration/release-ships-pharaohka-buyan-20261118
    paths:
      - '.github/workflows/integration-ships-pharaohka-buyan-20261118.yml'
      - 'src/**'
      - 'tools/**'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-build:
    name: Clean NeoForge build and ship IV geometry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Clean full mod build
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --console=plain --stacktrace
      - name: Verify ship IV geometry
        run: ./gradlew verifyShipIVGeometry --no-daemon --console=plain
      - name: Compile and validate tier III/IV rigging geometry
        run: |
          mkdir -p .ship-sail-proof
          javac -encoding UTF-8 -d .ship-sail-proof \
            src/main/java/org/slavicmyths/ships/ShipSectionPlan.java \
            src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java \
            src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java \
            src/main/java/org/slavicmyths/ships/ShipSailRigGeometry.java \
            tools/ship-sail-checks/ShipSailRigProof.java
          java -Xmx2g -cp .ship-sail-proof ShipSailRigProof
      - name: Upload verified build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-ships-pharaohka-buyan-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  ocean-gametests:
    name: Ocean/ships isolated GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ship movement, cargo and persistence tests
        run: chmod +x gradlew && ./gradlew -Pocean26Check runOcean26Checks --no-daemon --console=plain

  pharaohka-gametests:
    name: Pharaohka isolated GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run water boss combat, spawn and survival tests
        run: chmod +x gradlew && ./gradlew -PpharaohkaCheck runPharaohkaTests --no-daemon --console=plain

  buyan-gametests:
    name: Buyan island isolated GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run island housing, port, shrine and flora tests
        run: chmod +x gradlew && ./gradlew -PbuyanOutpostCheck runBuyanOutpostChecks --no-daemon --console=plain

  integration-report:
    name: Record combined CI result
    if: ${{ always() }}
    needs: [clean-build, ocean-gametests, pharaohka-gametests, buyan-gametests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLEAN_BUILD: ${{ needs.clean-build.result }}
      OCEAN_TESTS: ${{ needs.ocean-gametests.result }}
      PHARAOHKA_TESTS: ${{ needs.pharaohka-gametests.result }}
      BUYAN_TESTS: ${{ needs.buyan-gametests.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit status report into integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin integration/release-ships-pharaohka-buyan-20261118
          git checkout -B integration-status origin/integration/release-ships-pharaohka-buyan-20261118
          mkdir -p docs/integration
          {
            echo '# Integration verification'
            echo
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Tested commit: \`${GITHUB_SHA}\`"
            echo "- Java 21 clean build and ship geometry: **${CLEAN_BUILD}**"
            echo "- Ship GameTests: **${OCEAN_TESTS}**"
            echo "- Pharaohka GameTests: **${PHARAOHKA_TESTS}**"
            echo "- Buyan GameTests: **${BUYAN_TESTS}**"
          } > docs/integration/VERIFICATION-20261118.md
          git add docs/integration/VERIFICATION-20261118.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record integrated Java 21 CI verification results'
            git push origin HEAD:refs/heads/integration/release-ships-pharaohka-buyan-20261118
          fi
