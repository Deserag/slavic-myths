name: Integrated release - Ships, Pharaohka, Buyan (Java 21)

on:
  push:
    branches:
      - integration/release-ships-pharaohka-buyan-20261118
    paths:
      - '.github/workflows/integration-ships-pharaohka-buyan-20261118.yml'
      - 'src/**'
      - 'tools/**'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-build:
    name: Clean NeoForge build and ship IV geometry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Clean full mod build
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --console=plain --stacktrace
      - name: Verify ship IV geometry
        run: ./gradlew verifyShipIVGeometry --no-daemon --console=plain
      - name: Compile and validate tier III/IV rigging geometry
        run: |
          mkdir -p .ship-sail-proof
          javac -encoding UTF-8 -d .ship-sail-proof \
            src/main/java/org/slavicmyths/ships/ShipSectionPlan.java \
            src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java \
            src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java \
            src/main/java/org/slavicmyths/ships/ShipSailRigGeometry.java \
            tools/ship-sail-checks/ShipSailRigProof.java
          java -Xmx2g -cp .ship-sail-proof ShipSailRigProof
      - name: Upload verified build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-ships-pharaohka-buyan-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  ocean-gametests:
    name: Ocean/ships isolated GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ship movement, cargo and persistence tests
        run: chmod +x gradlew && ./gradlew -Pocean26Check runOcean26Checks --no-daemon --console=plain

  pharaohka-gametests:
    name: Pharaohka isolated GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run water boss combat, spawn and survival tests
        run: chmod +x gradlew && ./gradlew -PpharaohkaCheck runPharaohkaTests --no-daemon --console=plain

  buyan-gametests:
    name: Buyan island isolated GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run island housing, port, shrine and flora tests
        run: chmod +x gradlew && ./gradlew -PbuyanOutpostCheck runBuyanOutpostChecks --no-daemon --console=plain
