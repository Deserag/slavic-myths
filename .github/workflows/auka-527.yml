name: Auka #527 — Java 21 and isolated boss GameTests
on:
  push:
    branches: ['feature/winter-auka-boss-20261123', 'fix/winter-gluheya-eggs-20261123']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auka:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Clean build with Auka Java sources
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --console=plain
      - name: Compile isolated Auka GameTests
        run: ./gradlew -PaukaCheck compileAukaCheckJava --no-daemon --console=plain
      - name: Run Auka consent, phase, timing and persistence GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PaukaCheck runAukaTests --no-daemon --console=plain 2>&1 | tee /tmp/auka-gametests.log
          if grep -Eqi 'Failed to start the minecraft server|ModLoadingCrashException|GameTest.*failed|[0-9]+ required tests failed' /tmp/auka-gametests.log; then exit 1; fi
          grep -Eq 'All [0-9]+ required tests passed' /tmp/auka-gametests.log
      - name: Upload logs and compiled artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auka-winter-boss-qa
          path: |
            build/reports/
            build/libs/
            /tmp/auka-gametests.log
          if-no-files-found: warn
          retention-days: 10
