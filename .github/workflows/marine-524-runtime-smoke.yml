name: Marine #524 client and dedicated-server boot smoke
on:
  push:
    branches: [integration/ocean-updates]
    paths:
      - '.github/workflows/marine-524-runtime-smoke.yml'
      - 'src/main/java/org/slavicmyths/marine/**'
      - 'src/main/java/org/slavicmyths/rpg/Runes.java'
      - 'src/main/java/org/slavicmyths/rpg/RuneRework.java'
      - 'src/main/java/org/slavicmyths/SlavicMyths.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dedicated-server:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot ordinary NeoForge dedicated server (not GameTestServer)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p /tmp/marine524-runtime run-server
          printf 'eula=true\n' > run-server/eula.txt
          ./gradlew --no-daemon --console=plain runServer > /tmp/marine524-runtime/server.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 240); do
            if grep -Eq 'Done \([0-9.,]+s\)! For help, type "help"' /tmp/marine524-runtime/server.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "DEDICATED_SERVER_BOOT_REACHED=$ready" | tee /tmp/marine524-runtime/server-result.txt
          if grep -Eiq 'ModLoadingCrashException|ExceptionInInitializerError|Report saved to: .*crash-reports' /tmp/marine524-runtime/server.log; then
            tail -160 /tmp/marine524-runtime/server.log
            exit 1
          fi
          if [ "$ready" != 1 ]; then tail -160 /tmp/marine524-runtime/server.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine524-dedicated-server-log
          path: /tmp/marine524-runtime/
          retention-days: 7
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1 scrot
      - name: Boot real NeoForge client under virtual display
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p /tmp/marine524-runtime
          Xvfb :99 -screen 0 1366x768x24 -nolisten tcp > /tmp/marine524-runtime/xvfb.log 2>&1 &
          xvpid=$!
          export DISPLAY=:99
          sleep 2
          glxinfo -B > /tmp/marine524-runtime/opengl.txt 2>&1
          ./gradlew --no-daemon --console=plain runClient > /tmp/marine524-runtime/client.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 240); do
            if grep -Eiq 'Sound engine started|OpenAL initialized|Reloading ResourceManager' /tmp/marine524-runtime/client.log; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" = 1 ]; then
            sleep 10
            scrot /tmp/marine524-runtime/client-screen.png || true
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          kill "$xvpid" 2>/dev/null || true
          echo "CLIENT_BOOT_REACHED=$ready" | tee /tmp/marine524-runtime/client-result.txt
          if grep -Eiq 'ModLoadingCrashException|ExceptionInInitializerError|Report saved to: .*crash-reports' /tmp/marine524-runtime/client.log; then
            tail -160 /tmp/marine524-runtime/client.log
            exit 1
          fi
          if [ "$ready" != 1 ]; then tail -160 /tmp/marine524-runtime/client.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine524-client-boot-evidence
          path: /tmp/marine524-runtime/
          retention-days: 7
