name: Weapons87 P39 Flail Motion Java21
on:
  push:
    branches:
      - feat/weapons87-p39-flail-motion-5issues
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: P39 flail production regression
        run: |
          python3 tools/verify_weapons87_p39.py
      - name: Java21 clean build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Verify resources in JAR
        run: |
          python3 tools/verify_weapons87_p39.py
          python3 tools/weapons87_live_audit.py --jar
          sha256sum build/libs/slavicmyths-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: weapons87-p39-jar
          path: build/libs/slavicmyths-*.jar
          retention-days: 14
