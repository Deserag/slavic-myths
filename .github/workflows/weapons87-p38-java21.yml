name: Weapons87 P38 Combat Visuals Java21
on:
  push:
    branches:
      - feat/weapons87-p38-combat-visuals-4issues
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: P38 five-issue source regression tests
        run: |
          python3 tools/verify_weapons87_p38.py
          python3 tools/verify_weapons87_kalin_wave.py
          python3 tools/verify_weapons87_p33.py
          python3 tools/verify_weapons87_storm_range.py
          python3 tools/verify_weapons87_crossbow_realstack.py
          python3 tools/weapons87_owner_qa.py
          python3 tools/verify_weapons87_p35.py
      - name: Java21 clean build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Check packaged weapons
        run: |
          python3 tools/weapons87_owner_qa.py --jar
          python3 tools/weapons87_live_audit.py --jar
          python3 tools/verify_weapons87_p33.py --jar
          sha256sum build/libs/slavicmyths-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: weapons87-p38-qa-jar
          path: |
            build/libs/slavicmyths-*.jar
            build/weapons87-p35/source-audit.json
          retention-days: 14
