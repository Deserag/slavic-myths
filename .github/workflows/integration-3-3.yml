name: Slavic Myths 3.3 integration Java 21

on:
  push:
    branches: ['3.3', 'integration/3.3-into-working-20261102']
  pull_request:
    branches: ['3.3']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Clean build and boss regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install asset verification dependency
        run: python3 -m pip install Pillow
      - name: Java 21 clean NeoForge build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --console=plain
      - name: Record source and production artifact SHA256
        shell: bash
        run: |
          git rev-parse HEAD
          sha256sum build/libs/slavicmyths-*.jar
      - name: Check both Creative spawn eggs
        run: python3 tools/qa/boss_spawn_eggs_2_3_check.py
      - name: Check Morovoy Raven assets and source
        run: python3 tools/morovoy_raven_391_check.py
      - name: Check global resource integrity
        run: python3 tools/verify_current_resources.py
      - name: Check Morovoy Zmey combat rules
        run: |
          mkdir -p build/zmey396
          javac -encoding UTF-8 -d build/zmey396 src/main/java/org/slavicmyths/morovoy/MorovoyZmeyRules.java tools/qa/MorovoyZmeyRulesSmoke.java
          java -cp build/zmey396 org.slavicmyths.morovoy.MorovoyZmeyRulesSmoke
      - name: Upload integration mod JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: slavic-myths-3-3-integration
          path: build/libs/slavicmyths-*.jar
          if-no-files-found: error
          retention-days: 14
