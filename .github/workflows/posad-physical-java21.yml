name: Posad 2.2 physical GameTest (isolated Java 21)
on:
  push:
    branches: [hell]
    paths:
      - 'src/main/java/org/slavicmyths/posad/**'
      - 'src/main/resources/data/slavicmyths/posad/**'
      - 'src/main/resources/data/slavicmyths/structure/posad/veche_hall_2_2_2.nbt'
      - 'src/main/resources/data/slavicmyths/structure/posad/communal_house_2_2_3.nbt'
      - 'src/main/resources/data/slavicmyths/loot_table/chests/nether_communal_*.json'
      - 'tools/posad-runtime-tests/**'
      - 'tools/posad-test-resources/**'
      - 'tools/posad-qa-runtime.gradle'
      - '.github/workflows/posad-physical-java21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-posad:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build real NeoForge production JAR
        shell: bash
        run: chmod +x gradlew && ./gradlew --no-daemon clean build --console=plain
      - name: Isolated physical Posad GameTest (NOT client QA)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/posad-ci
          ./gradlew --no-daemon -I tools/posad-qa-runtime.gradle runPosadQa -PposadQaDir=work/posad-qa-20261030/github-actions --console=plain 2>&1 | tee build/posad-ci/game-test.log
          # NeoForge can report a fatal mod-loader error while Gradle task itself exits 0.
          # Require proof of actual Minecraft GameTest execution, not just a successful wrapper.
          if grep -Eiq 'Mod loading has failed|Failed to start the minecraft server|not a valid mod file|[0-9]+ required tests failed|GAME TESTS FAILED' build/posad-ci/game-test.log; then
            echo 'FAIL: GameTest server crashed or one/more required tests failed'
            exit 1
          fi
          if ! grep -Eq '[0-9]+ GAME TESTS COMPLETE' build/posad-ci/game-test.log; then
            echo 'FAIL: no Minecraft GameTest completion evidence'
            exit 1
          fi
      - name: Upload logs (not owner acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posad-physical-${{ github.sha }}
          path: build/posad-ci/
          if-no-files-found: warn
          retention-days: 14
