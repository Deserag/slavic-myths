name: Weapon skill input standard

on:
  push:
    branches:
      - feature/weapon-skill-input-standard-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weapon-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 102-item catalog and input routing
        run: python3 tools/weapon_skill_input_check.py
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew
      - name: Compile and test
        run: ./gradlew clean build --no-daemon
