name: Ocean 2.6 - continuous moving contraption motion proof
on:
  push:
    paths:
      - "src/main/java/org/slavicmyths/ships/ShipRigidMotion.java"
      - "src/main/java/org/slavicmyths/ships/FirstShipHull.java"
      - "src/main/java/org/slavicmyths/ships/FirstShipV10Shape.java"
      - "experimental/raft26/ShipRigidMotionProof.java"
      - ".github/workflows/ship-rigid-motion-proof.yml"
  pull_request:
    paths:
      - "src/main/java/org/slavicmyths/ships/ShipRigidMotion.java"
      - "src/main/java/org/slavicmyths/ships/FirstShipHull.java"
      - "src/main/java/org/slavicmyths/ships/FirstShipV10Shape.java"
      - "experimental/raft26/ShipRigidMotionProof.java"
      - ".github/workflows/ship-rigid-motion-proof.yml"
permissions:
  contents: read
jobs:
  continuous-motion-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and run real fractional-motion proof without Minecraft
        run: |
          mkdir -p build/ship-rigid-motion-proof
          javac --release 21 -encoding UTF-8 -d build/ship-rigid-motion-proof \
            src/main/java/org/slavicmyths/ships/FirstShipV10Shape.java \
            src/main/java/org/slavicmyths/ships/FirstShipHull.java \
            src/main/java/org/slavicmyths/ships/ShipRigidMotion.java \
            experimental/raft26/ShipRigidMotionProof.java
          java -ea -cp build/ship-rigid-motion-proof ShipRigidMotionProof
