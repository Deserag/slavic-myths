name: Weapon skill isolation and winter resources
on:
  push:
    branches: ['feature/ocean-rewards-completion-20261120']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Gluheya PNG chunks and decompression
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          p=Path('src/main/resources/assets/slavicmyths/textures/entity/gluheya.png')
          data=p.read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n'
          offset=8; compressed=bytearray(); ended=False
          while offset<len(data):
              n,=struct.unpack_from('>I',data,offset)
              kind=data[offset+4:offset+8]; body=data[offset+8:offset+8+n]
              assert len(body)==n
              crc,=struct.unpack_from('>I',data,offset+8+n)
              assert zlib.crc32(kind+body)==crc
              if kind==b'IHDR': assert struct.unpack_from('>II',body)==(512,512)
              if kind==b'IDAT': compressed.extend(body)
              if kind==b'IEND': ended=True
              offset+=12+n
          assert ended and offset==len(data)
          assert len(zlib.decompress(compressed))==512*513
          PY
      - name: Validate trophy particle sprites and model references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets=Path('src/main/resources/assets')
          atlas=json.loads((assets/'minecraft/atlases/blocks.json').read_text())
          sprites={s['resource'] for s in atlas['sources'] if s.get('type')=='minecraft:single'}
          models=assets/'slavicmyths/models/block'
          for model in sorted(models.glob('*head*.json')):
              if any(s in model.stem for s in ('bed','cot')): continue
              textures=json.loads(model.read_text()).get('textures',{})
              particle=textures.get('particle',textures.get('all'))
              assert particle, f'No particle sprite: {model}'
              if particle.startswith('slavicmyths:'):
                  path=particle.split(':',1)[1]
                  assert (assets/'slavicmyths/textures'/f'{path}.png').is_file(), particle
                  assert path.startswith(('block/','item/')) or particle in sprites, f'Not stitched: {particle}'
          assert 'slavicmyths:entity/winter_owl' in sprites
          PY
      - name: Clean build and compile regression tests
        run: chmod +x gradlew && ./gradlew clean build -PmarineArmorCheck compileMarineArmorCheckJava --no-daemon --console=plain
      - name: Native GameTests (both input orders)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PmarineArmorCheck runMarineArmorTests --no-daemon --console=plain 2>&1 | tee /tmp/weapon-skill-gametests.log
          grep -Eq 'All [0-9]+ required tests passed' /tmp/weapon-skill-gametests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-skill-gametests
          path: /tmp/weapon-skill-gametests.log
          if-no-files-found: warn
