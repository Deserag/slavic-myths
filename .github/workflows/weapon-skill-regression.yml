name: Weapon skill isolation and winter resources
on:
  push:
    branches: ['feature/ocean-rewards-completion-20261120']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Gluheya PNG chunks and decompression
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          p=Path('src/main/resources/assets/slavicmyths/textures/entity/gluheya.png')
          data=p.read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n'
          offset=8; compressed=bytearray(); ended=False
          while offset<len(data):
              n,=struct.unpack_from('>I',data,offset)
              kind=data[offset+4:offset+8]; body=data[offset+8:offset+8+n]
              assert len(body)==n
              crc,=struct.unpack_from('>I',data,offset+8+n)
              assert zlib.crc32(kind+body)==crc
              if kind==b'IHDR': assert struct.unpack_from('>II',body)==(512,512)
              if kind==b'IDAT': compressed.extend(body)
              if kind==b'IEND': ended=True
              offset+=12+n
          assert ended and offset==len(data)
          assert len(zlib.decompress(compressed))==512*513
          PY
      - name: Clean build and compile regression tests
        run: chmod +x gradlew && ./gradlew clean build -PmarineArmorCheck compileMarineArmorCheckJava --no-daemon --console=plain
      - name: Native GameTests (both input orders)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PmarineArmorCheck runMarineArmorTests --no-daemon --console=plain 2>&1 | tee /tmp/weapon-skill-gametests.log
          grep -Eq 'All [0-9]+ required tests passed' /tmp/weapon-skill-gametests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-skill-gametests
          path: /tmp/weapon-skill-gametests.log
          if-no-files-found: warn
