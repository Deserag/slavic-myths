name: Weapons87 P41 Five Unique Weapons Java21
on:
  push:
    branches:
      - feat/weapons87-p41-five-unique-art
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Five actual unique-model checks
        run: |
          python3 tools/weapons87_p41_overlay.py
          python3 tools/verify_weapons87_p41.py
          python3 tools/weapons87_unique_art.py --check
      - name: Java21 clean Gradle build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Check resource bytes in production jar
        run: |
          python3 tools/verify_weapons87_p41.py --jar
          python3 tools/weapons87_unique_art.py --jar
          python3 tools/weapons87_live_audit.py --jar
          sha256sum build/libs/slavicmyths-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: weapons87-p41-unique-art-jar
          path: build/libs/slavicmyths-*.jar
          retention-days: 14
