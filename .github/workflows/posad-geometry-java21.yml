name: Posad 2.3 Java 21 offline geometry (not Minecraft QA)
on:
  push:
    branches: [hell, 'feat/2.3-pekelny-posad']
    paths:
      - 'src/main/java/org/slavicmyths/posad/**'
      - 'tools/posad-tests/**'
      - 'src/main/resources/data/slavicmyths/posad/**'
      - 'src/main/resources/data/slavicmyths/loot_table/chests/nether_communal_*.json'
      - 'src/main/resources/data/slavicmyths/structure/posad/**'
      - 'src/main/resources/data/slavicmyths/loot_table/chests/nether_market_*.json'
      - 'docs/concepts/nether-settlement-2.2/menovye-ryady-2.2.6/2.2_6_MARKET_VOXELS_DRAFT_A.json'
      - 'src/main/resources/data/slavicmyths/loot_table/chests/posad_zeleynaya_*.json'
      - 'docs/concepts/nether-settlement-2.2/zeleynaya-izba-2.2.7/MODEL_R1.json'
      - '.github/workflows/posad-geometry-java21.yml'
  workflow_dispatch:
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and execute pure Java geometry contract
        run: |
          mkdir -p build/posad-check
          javac -encoding UTF-8 -d build/posad-check src/main/java/org/slavicmyths/posad/PosadGeometry.java src/main/java/org/slavicmyths/posad/PosadRetrofitPolicy.java tools/posad-tests/PosadGeometryCheck.java
          java -ea -cp build/posad-check org.slavicmyths.posad.PosadGeometryCheck
      - name: Compare budgeted terrain survey with native terrain planner (pure Java 21)
        run: |
          javac -encoding UTF-8 -cp build/posad-check -d build/posad-check src/main/java/org/slavicmyths/posad/PosadTerrain.java src/main/java/org/slavicmyths/posad/PosadTerrainSurvey.java tools/posad-tests/PosadTerrainCheck.java tools/posad-tests/PosadTerrainSurveyCheck.java
          java -ea -cp build/posad-check org.slavicmyths.posad.PosadTerrainCheck
          java -ea -cp build/posad-check org.slavicmyths.posad.PosadTerrainSurveyCheck
      - name: Verify exact Menovye Ryady market model and eight loot tables
        run: python3 tools/posad-tests/verify_market_nbt.py
      - name: Verify Vече / communal R1 models and four loot tables (offline)
        run: python3 tools/posad-tests/verify_city_buildings.py
      - name: Verify committed exact 2.2.2/2.2.3 structure NBT (offline)
        run: python3 tools/posad-tests/verify_generated_building_nbt.py
      - name: Verify exact #350/#351 structures, loot and 10k captain reward simulations
        run: python3 tools/posad-tests/verify_next_buildings.py
      - name: Simulate 10,000 seeded communal loot tables (offline only)
        run: python3 tools/posad-tests/verify_communal_loot_distribution.py
      - name: Verify real compressed 2.2.7 NBT and loot bindings (offline)
        run: python3 tools/posad-tests/verify_zeleynaya_nbt.py
