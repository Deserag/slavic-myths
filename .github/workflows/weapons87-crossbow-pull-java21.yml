name: Weapons87 Crossbow Pull Java21
on:
  push:
    branches:
      - fix/weapons87-crossbow-pull-progress
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source checks
        run: |
          python3 tools/verify_weapons87_crossbow_pull.py
          python3 tools/verify_weapons87_crossbow_recoil.py
          python3 tools/verify_weapons87_crossbows.py
      - name: Java21 clean build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Jar verification
        run: |
          python3 tools/verify_weapons87_crossbow_recoil.py --jar
          python3 tools/weapons87_live_audit.py --jar
          sha256sum build/libs/slavicmyths-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: weapons87-crossbow-pull-jar
          path: build/libs/slavicmyths-*.jar
          retention-days: 14
