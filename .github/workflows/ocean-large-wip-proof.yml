name: Ocean 2.6 - WIP medium and large hull geometry only
on:
  push:
    branches: ["wip/2.6-ocean-medium-large-20261108"]
  pull_request:
    branches: ["fix/2.6-ocean-crew-sails-20261108"]
permissions:
  contents: read
jobs:
  validate-blueprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and check deterministic future ship layouts (NOT playable)
        run: |
          mkdir -p build/ocean-large-proof
          javac -encoding UTF-8 -d build/ocean-large-proof src/main/java/org/slavicmyths/ships/experimental/OceanLargerHullBlueprint.java experimental/raft26/OceanLargerHullProof.java
          java -ea -cp build/ocean-large-proof OceanLargerHullProof
