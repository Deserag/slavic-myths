name: Buyan villagers - Java 21 build and static island guards

on:
  push:
    branches: [integration/ocean-updates]
    paths:
      - 'src/main/java/org/slavicmyths/buyan/**'
      - 'src/main/java/org/slavicmyths/village/**'
      - 'src/main/java/org/slavicmyths/client/VillageVisuals.java'
      - 'src/main/resources/assets/slavicmyths/textures/entity/buyan/**'
      - 'src/main/resources/slavicmyths.work.mixins.json'
      - '.github/workflows/buyan-villagers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile mod, verify models and NPC island conditions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Buyan-only spawn gates, coin trading and PNG geometry
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import struct
          java=Path('src/main/java/org/slavicmyths/buyan/BuyanPopulation.java').read_text(encoding='utf-8')
          trades=Path('src/main/java/org/slavicmyths/buyan/BuyanTrades.java').read_text(encoding='utf-8')
          layer=Path('src/main/java/org/slavicmyths/client/VillageVisuals.java').read_text(encoding='utf-8')
          assert 'completedSites()' in java and 'BuyanCityHousing.hasBuilt' in java and 'BuyanTerem.hasBuilt' in java
          assert '1L << slot' in java and 'world.addFreshEntity(villager)' in java
          assert 'BUYAN_ROLE' in trades and 'ANCIENT_COIN' in trades
          assert 'if(!entity.getData(VillageRoles.BUYAN_ROLE).isEmpty()) return;' in layer
          assets=Path('src/main/resources/assets/slavicmyths/textures/entity/buyan')
          roles=['zemledelec','rybak','kuznec','tkach','travnik','kupec','obychny','knyaz']
          for role in roles:
              content=(assets/(role+'.png')).read_bytes()
              assert content[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',content[16:24])==(64,64)
          print('Island-only spawn guard and eight 64x64 vanilla UV textures: OK')
          PYTHON
      - name: Full NeoForge Java 21 build
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --console=plain --stacktrace
      - name: Village geometry and lifecycle tests
        run: ./gradlew -PvillageRuntimeCheck -PwithoutJei runVillageChecks verifyVillageGeometry --no-daemon --console=plain
      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: buyan-villagers-tested-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
