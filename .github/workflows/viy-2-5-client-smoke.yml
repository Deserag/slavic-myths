name: Viy 2.5 isolated client launch smoke
on:
  push:
    branches: ['integration/2.5-viy-416-20261105']
    paths: ['.github/workflows/viy-2-5-client-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Launch NeoForge 1.21.1 under Xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and software renderer
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1 scrot
      - name: Launch isolated Minecraft client, capture screen and logs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p /tmp/viy-client-qa
          Xvfb :99 -screen 0 1366x768x24 -nolisten tcp > /tmp/viy-client-qa/xvfb.log 2>&1 &
          XVPID=$!
          export DISPLAY=:99
          sleep 2
          glxinfo -B > /tmp/viy-client-qa/opengl.txt 2>&1
          ./gradlew --no-daemon runClient --console=plain > /tmp/viy-client-qa/client.log 2>&1 &
          GPID=$!
          reached=0
          for i in $(seq 1 260); do
            if grep -Eiq 'Sound engine started|OpenAL initialized|Reloading ResourceManager' /tmp/viy-client-qa/client.log; then reached=1; break; fi
            if ! kill -0 "$GPID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$reached" -eq 1 ]; then
            sleep 8
            scrot /tmp/viy-client-qa/client-screen.png || true
            echo "CLIENT_BOOT_REACHED=1" | tee /tmp/viy-client-qa/result.txt
          else
            echo "CLIENT_BOOT_REACHED=0" | tee /tmp/viy-client-qa/result.txt
          fi
          kill "$GPID" 2>/dev/null || true
          wait "$GPID" 2>/dev/null || true
          kill "$XVPID" 2>/dev/null || true
          if [ "$reached" -ne 1 ]; then tail -150 /tmp/viy-client-qa/client.log; exit 1; fi
          if grep -Eq 'Report saved to: .*crash-reports|ExceptionInInitializerError|Cannot register DeferredRegister to more than one event bus' /tmp/viy-client-qa/client.log; then
            tail -150 /tmp/viy-client-qa/client.log
            exit 1
          fi
      - name: Upload isolated client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viy-2-5-client-smoke-evidence
          path: /tmp/viy-client-qa/
          retention-days: 7
          if-no-files-found: warn
