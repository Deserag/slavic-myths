name: Weapons 87 - crossbow P14 Java 21
on:
  push:
    branches:
      - feat/weapons87-p14-crossbow-grips
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python source and grip regression gates
        run: python3 tools/verify_weapons87_crossbows.py
      - name: Java 21 clean production build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Recheck assets and assembled JAR
        run: |
          python3 tools/verify_weapons87_crossbows.py
          test -n "$(find build/libs -maxdepth 1 -name 'slavicmyths-*.jar' -size +100k -print -quit)"
          sha256sum build/libs/slavicmyths-*.jar
