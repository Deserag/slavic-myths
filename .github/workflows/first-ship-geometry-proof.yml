name: Ocean 2.6 - first two-deck ship geometry
on:
  push:
    paths:
      - "src/main/java/org/slavicmyths/ships/FirstShipHull.java"
      - "src/main/java/org/slavicmyths/ships/FirstShipV10Shape.java"
      - "tools/ship-section-tests/FirstShipV10ShapeCheck.java"
      - "experimental/raft26/FirstShipHullProof.java"
      - ".github/workflows/first-ship-geometry-proof.yml"
  pull_request:
    paths:
      - "src/main/java/org/slavicmyths/ships/FirstShipHull.java"
      - "src/main/java/org/slavicmyths/ships/FirstShipV10Shape.java"
      - "tools/ship-section-tests/FirstShipV10ShapeCheck.java"
      - "experimental/raft26/FirstShipHullProof.java"
      - ".github/workflows/first-ship-geometry-proof.yml"
jobs:
  prove-hull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile ship geometry
        run: |
          mkdir -p build/first-ship-proof
          javac --release 21 -encoding UTF-8 -d build/first-ship-proof \
            src/main/java/org/slavicmyths/ships/FirstShipV10Shape.java \
            src/main/java/org/slavicmyths/ships/FirstShipHull.java \
            experimental/raft26/FirstShipHullProof.java \
            tools/ship-section-tests/FirstShipV10ShapeCheck.java
      - name: Test both floors, helm, ladder and reversible motion
        run: |
          java -ea -cp build/first-ship-proof FirstShipHullProof
          java -ea -cp build/first-ship-proof FirstShipV10ShapeCheck
