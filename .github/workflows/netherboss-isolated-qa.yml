name: Nether bosses isolated client QA
on:
  push:
    branches: [codex/hell-bosses-completion-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    if: github.ref == 'refs/heads/codex/hell-bosses-completion-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [slim, wide]
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
      HELL_VISUAL_SCOPE: bosses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1 ffmpeg
      - name: Build production JAR
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p /tmp/hell-visual-qa
          ./gradlew --no-daemon clean build --console=plain 2>&1 | tee /tmp/hell-visual-qa/build.log
          sha256sum build/libs/slavicmyths-*.jar | tee /tmp/hell-visual-qa/jar.sha256
          git rev-parse HEAD | tee /tmp/hell-visual-qa/source.txt
      - name: Capture actual packaged mod in isolated Xvfb client
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' sh -c 'glxinfo -B; timeout 15m ./gradlew --no-daemon -I tools/hell-visual-qa.gradle runHellVisualQa -PhellVisualScope="$HELL_VISUAL_SCOPE" -PhellVisualModel=${{ matrix.model }} --console=plain' 2>&1 | tee /tmp/hell-visual-qa/client.log
          test -f build/hell-visual-qa/frames/finished.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netherboss-isolated-client-${{ matrix.model }}-${{ github.sha }}
          path: |
            /tmp/hell-visual-qa/
            build/hell-visual-qa/
            work/hell-visual-qa-isolated/logs/
          retention-days: 14

  multiplayer:
    if: github.ref == 'refs/heads/codex/hell-bosses-completion-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1 ffmpeg
      - name: Build and export two-client launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build -PnetherBossCheck runNetherBossChecks -I tools/hell-visual-qa.gradle -I tools/netherboss-client-launch.gradle exportBossClientLaunch -PhellVisualScope=bosses --console=plain
      - name: Actual loopback multiplayer and thirty diagnostic fights
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 tools/run_netherboss_mp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netherboss-two-client-mp-${{ github.sha }}
          path: |
            build/netherboss-mp/
            build/libs/slavicmyths-*.jar
            work/netherboss-mp-host/logs/
            work/netherboss-mp-peer/logs/
          retention-days: 14
