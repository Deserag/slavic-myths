name: Desert biome blocks - Java 21
on:
  push:
    branches: ["feature/desert-biome-20261125"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/sand_king/requirements.txt
      - run: chmod +x gradlew
      - run: ./gradlew clean build --no-daemon --console=plain
      - name: Verify Sand King geometry and combat timeline
        run: |
          mkdir -p /tmp/sand-king-check
          javac -d /tmp/sand-king-check src/main/java/org/slavicmyths/desert/SandKingGeometry.java src/main/java/org/slavicmyths/desert/SandKingRules.java tools/sand_king/GeometryCheck.java tools/sand_king/RulesCheck.java
          java -cp /tmp/sand-king-check:build/resources/main GeometryCheck
          java -cp /tmp/sand-king-check RulesCheck
      - name: Verify ant geometry and combat rules
        run: |
          mkdir -p /tmp/ant-check
          javac -d /tmp/ant-check src/main/java/org/slavicmyths/desert/AntRules.java src/main/java/org/slavicmyths/desert/AntGeometry.java tools/ant_queen/AntGeometryCheck.java
          java -cp /tmp/ant-check AntGeometryCheck
      - name: Verify Hala V2 geometry and burn rules
        run: |
          mkdir -p /tmp/hala-check
          javac -d /tmp/hala-check src/main/java/org/slavicmyths/desert/HalaGeometry.java src/main/java/org/slavicmyths/desert/HalaRules.java tools/hala/RulesCheck.java
          java -cp /tmp/hala-check:build/resources/main RulesCheck
      - name: Verify Storm Idol procedural mesh
        run: |
          mkdir -p /tmp/storm-idol-check
          javac -d /tmp/storm-idol-check src/main/java/org/slavicmyths/client/StormIdolMesh.java tools/storm_idol/StormIdolMeshCheck.java
          java -cp /tmp/storm-idol-check org.slavicmyths.client.StormIdolMeshCheck
      - name: Verify Indrik articulated collision support
        run: |
          mkdir -p /tmp/indrik-check
          javac -d /tmp/indrik-check src/main/java/org/slavicmyths/desert/IndrikGeometry.java src/main/java/org/slavicmyths/desert/IndrikRules.java tools/indrik/GeometryCheck.java
          java -cp /tmp/indrik-check:build/resources/main GeometryCheck
      - name: Verify Lamya exported mesh and collision frames
        run: python3 tools/lamya/check.py build/resources/main/assets/slavicmyths/lamya
      - name: Verify packaged desert block assets
        run: python3 tools/verify_desert_blocks.py
      - name: Check 1000 generated desert tree geometries
        run: |
          mkdir -p /tmp/desert-tree
          javac -d /tmp/desert-tree src/main/java/org/slavicmyths/wood/TreeShape.java tools/desert-tests/DesertTreeShapeCheck.java
          java -cp /tmp/desert-tree DesertTreeShapeCheck
      - name: Run native seal GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PdesertCheck runDesertTests --no-daemon --console=plain 2>&1 | tee /tmp/desert-gametest.log
          if grep -Eiq 'Duplicate registration|Failed to create mod instance|Mod loading failed|Failed to load correctly|ExceptionInInitializerError|broken mod state|Failed to start the minecraft server' /tmp/desert-gametest.log; then
            echo "GameTest runtime initialization failed"; exit 1
          fi
          grep -Eiq 'All (1[89]|[2-9][0-9]|[1-9][0-9]{2,}) required tests passed' /tmp/desert-gametest.log || { echo "No explicit successful GameTest result"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: desert-biome-mod
          path: build/libs/*.jar
          if-no-files-found: error
