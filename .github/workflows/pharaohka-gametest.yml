name: Pharaohka Java 21 GameTests
on:
  push:
    branches: ["фараонка"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marine-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile main project and run isolated marine GameTests
        run: |
          chmod +x gradlew
          ./gradlew -PpharaohkaCheck --no-daemon runPharaohkaTests --console=plain
      - name: Upload GameTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pharaohka-gametest-logs
          path: |
            run-pharaohka-check/logs/**
            run-pharaohka-check/crash-reports/**
          if-no-files-found: ignore
