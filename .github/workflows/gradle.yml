name: Java CI with Gradle

on:
  push:
    branches: [ "integration/3.3-into-working-20261102", "release-2.5" ]
  pull_request:
    branches: [ "integration/3.3-into-working-20261102", "release-2.5" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем репозиторий в виртуальную машину GitHub
    - uses: actions/checkout@v4

    # 2. Устанавливаем JDK 21 (Temurin)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Настраиваем Gradle и включаем кэширование зависимостей для быстрой сборки
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Выдаем права на запуск Linux-скрипту gradlew внутри виртуалки
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Запускаем компиляцию мода (тот самый clean build)
    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon

    # Issue #480: source textures/models plus byte-identical packaging in production JAR.
    # Static resource gate; it does not run Minecraft or GameTest.
    - name: Validate Nether food 2.5 production JAR contents
      if: github.base_ref == 'release-2.5' || github.ref == 'refs/heads/release-2.5'
      run: python3 tools/validate_nether_food_25.py --jar

    - name: Upload unaccepted 2.5 JAR for inspection
      if: (github.base_ref == 'release-2.5' || github.ref == 'refs/heads/release-2.5') && success()
      uses: actions/upload-artifact@v4
      with:
        name: nether-food-25-unaccepted-build
        path: build/libs/*.jar
        if-no-files-found: error
