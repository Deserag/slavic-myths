name: Ship IV Java validation

on:
  push:
    branches:
      - feat/2.6-largest-hull-overhaul-20261113
    paths:
      - 'src/main/java/org/slavicmyths/ships/**'
      - 'tools/ship-iv-tests/**'
      - 'build.gradle'
      - '.github/workflows/ship-iv-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ship-iv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify full Java compilation and IV geometry
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build verifyShipIVGeometry
