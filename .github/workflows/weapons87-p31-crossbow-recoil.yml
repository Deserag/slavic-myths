name: Weapons87 P31 first-person crossbow recoil Java21
on:
  push:
    branches:
      - feat/weapons87-p31-crossbow-firstperson-recoil
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify isolated P31 recoil state and existing actual crossbow models
        run: |
          python3 tools/verify_weapons87_crossbow_recoil.py
          python3 tools/verify_weapons87_crossbows.py
          python3 tools/weapons87_owner_qa.py
      - name: Build clean Java21 NeoForge JAR
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Check assembled source assets and newly compiled client class
        run: |
          python3 tools/verify_weapons87_crossbow_recoil.py --jar
          python3 tools/weapons87_owner_qa.py --jar
          python3 tools/weapons87_live_audit.py --jar
          sha256sum build/libs/slavicmyths-*.jar
      - name: Make four-phase actual-source item storyboard
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 tools/weapons87_recoil_storyboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: weapons87-p31-client-recoil-source-and-jar
          path: |
            docs/implementation/weapons87/blueprints/p31-crossbow-recoil/*.png
            docs/implementation/weapons87/blueprints/p31-crossbow-recoil/*.json
            build/libs/slavicmyths-*.jar
          retention-days: 14
