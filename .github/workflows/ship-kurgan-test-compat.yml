name: Patch 2.6 - Kurgan kitchen test API compatibility
on:
  push:
    branches: ["fix/2.6-small-ship-gameplay-visuals-20261109"]
    paths:
      - "tools/kurgan-tests/**"
      - "tools/kurgan-test-resources/**"
      - ".github/workflows/ship-kurgan-test-compat.yml"
permissions:
  contents: read
concurrency:
  group: ship-kurgan-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kurgan-game-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile current kitchen and Kurgan GameTests against real NeoForge APIs
        run: chmod +x gradlew && ./gradlew --no-daemon compileKurganCheckJava --console=plain
      - name: Run isolated Kurgan hotfix GameTests against real server
        run: ./gradlew -PportRuntimeCheck -PkurganHotfixCheck --no-daemon runRuntimeChecks --console=plain
