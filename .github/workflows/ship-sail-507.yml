name: Ship sails and rigging #507 - geometry, build and GameTests

on:
  pull_request:
    branches:
      - fix/ships-3-4-wip
    paths:
      - 'src/main/java/org/slavicmyths/ships/**'
      - 'tools/ship-sail-checks/**'
      - '.github/workflows/ship-sail-507.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sail-geometry:
    name: Deterministic cloth and anchored rigging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile production geometry independently of the Minecraft client
        run: |
          mkdir -p .ship-sail-proof
          javac -encoding UTF-8 -d .ship-sail-proof \
            src/main/java/org/slavicmyths/ships/ShipSectionPlan.java \
            src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java \
            src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java \
            src/main/java/org/slavicmyths/ships/ShipSailRigGeometry.java \
            tools/ship-sail-checks/ShipSailRigProof.java
      - name: Validate tiers, mixed upgrades and physical line anchors
        run: java -Xmx2g -cp .ship-sail-proof ShipSailRigProof

  neoforge-build:
    name: Build mod and run headless ship GameTests
    needs: sail-geometry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Full clean Minecraft 1.21.1 NeoForge build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build
      - name: Verify Ship IV geometry compatibility
        run: ./gradlew --no-daemon verifyShipIVGeometry
      - name: Run one isolated headless GameTest session
        run: ./gradlew --no-daemon -Pocean26Check runOcean26Checks
      - name: Record built JAR hashes
        if: success()
        run: sha256sum build/libs/*.jar
