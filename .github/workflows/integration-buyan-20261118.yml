name: Integration Buyan after Ships and Pharaohka (temporary)
on:
  push:
    branches:
      - integration/release-ships-pharaohka-buyan-20261118
    paths:
      - .github/workflows/integration-buyan-20261118.yml
permissions:
  contents: write
jobs:
  merge-buyan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge Buyan last while retaining ship, boss and translations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/feature/buyan-2.6.2.2-nature:refs/remotes/origin/buyan-source"
          git merge --no-ff --no-commit -s ort -X ours origin/buyan-source || true
          while IFS= read -r -d '' path; do
            git checkout --ours -- "$path" || git rm -f -- "$path"
            git add -A -- "$path"
          done < <(git diff --name-only --diff-filter=U -z)
          if test -f .git/MERGE_HEAD; then
            git commit -m "Merge Buyan island after ships and Pharaohka; retain existing integration fixes"
          else
            echo "No merge needed"
          fi
          test -s src/main/java/org/slavicmyths/buyan/BuyanCityPlan.java
          test -s src/main/java/org/slavicmyths/buyan/BuyanCityHousing.java
          test -s src/main/java/org/slavicmyths/buyan/BuyanShrine.java
          test -s src/main/resources/assets/slavicmyths/textures/block/gold_birch_log_side.png
          test -s tools/pharaohka-test-resources/data/slavicmyths_pharaohka/structure/empty.nbt
          grep -Fq 'BuyanFlora.init()' src/main/java/org/slavicmyths/SlavicMyths.java || grep -Fq 'BuyanFlora.init(bus)' src/main/java/org/slavicmyths/SlavicMyths.java
          grep -Fq 'PharaohkaContent.init(bus)' src/main/java/org/slavicmyths/SlavicMyths.java
          grep -Fq 'BuyanCommands.register(tree)' src/main/java/org/slavicmyths/commands/SlavicCommands.java
          grep -Fq 'pharaohka_leader' src/main/resources/assets/slavicmyths/lang/ru_ru.json
          grep -Fq 'gold_birch_log' src/main/resources/assets/slavicmyths/lang/ru_ru.json
          git push origin "HEAD:refs/heads/integration/release-ships-pharaohka-buyan-20261118"
