name: Posad R1 military and forge assets (hell only)
on:
  push:
    branches: [hell]
    paths:
      - 'tools/generate_posad_next_buildings.py'
      - 'docs/concepts/nether-settlement-2.2/druzhinny-dvor-2.2.4/2.2_DRUZHINNY_DVOR_MODEL_R1.json'
      - 'docs/concepts/nether-settlement-2.2/druzhinny-dvor-2.2.4/loot_drafts/**'
      - 'docs/concepts/nether-settlement-2.2/kuznechny-dvor-2.2.5/2.2_KUZNECHNY_DVOR_MODEL_R1.json'
      - 'docs/concepts/nether-settlement-2.2/kuznechny-dvor-2.2.5/loot_drafts/**'
      - '.github/workflows/posad-next-buildings-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: posad-next-assets-hell
  cancel-in-progress: false
jobs:
  build-assets:
    if: github.repository == 'Deserag/slavic-myths' && github.ref == 'refs/heads/hell'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate approved full NBT and compressed exact JSON
        run: |
          set -euo pipefail
          python3 tools/generate_posad_next_buildings.py
          python3 -m compileall -q tools/generate_posad_next_buildings.py
      - name: Publish only declared generated assets with ordinary fast-forward push
        run: |
          set -euo pipefail
          git add -- \
            src/main/resources/data/slavicmyths/structure/posad/druzhinny_dvor_2_2_4.nbt \
            src/main/resources/data/slavicmyths/structure/posad/kuznechny_dvor_2_2_5.nbt \
            src/main/resources/data/slavicmyths/posad/druzhinny_dvor_2_2_4.gz.base64 \
            src/main/resources/data/slavicmyths/posad/kuznechny_dvor_2_2_5.gz.base64 \
            src/main/resources/data/slavicmyths/loot_table/chests/nether_druzhina_*.json \
            src/main/resources/data/slavicmyths/loot_table/chests/nether_forge_*.json
          if git diff --cached --quiet; then
            echo 'PASS: generated resources are already committed and identical'
            exit 0
          fi
          git config user.name "slavic-myths-posad-assets[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(posad): publish exact R1 military and forge NBT with approved loot"
          baseline="$(git rev-parse HEAD^)"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/hell; then
              exit 0
            fi
            git fetch origin hell
            if ! git diff --quiet "$baseline" origin/hell -- \
              tools/generate_posad_next_buildings.py \
              docs/concepts/nether-settlement-2.2/druzhinny-dvor-2.2.4 \
              docs/concepts/nether-settlement-2.2/kuznechny-dvor-2.2.5; then
              echo 'FAIL: an approved source changed; do not publish stale resources'
              exit 1
            fi
            git rebase origin/hell
          done
          echo 'FAIL: too many concurrent branch updates'
          exit 1
