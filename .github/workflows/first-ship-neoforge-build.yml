name: Ocean 2.6 - first ship Java21 NeoForge build
on:
  push:
    branches: ["feature/2.6-first-two-deck-ship-20261108", "rewrite/2.6-native-block-ship-20261108", "fix/2.6-ocean-crew-sails-20261108", "fix/2.6-small-ship-gameplay-visuals-20261109", "feat/2.6-smooth-ship-contraption-20261109"]
  pull_request:
    branches: ["fix/2.6-raft-safety-audit-20261108", "feature/2.6-first-two-deck-ship-20261108", "rewrite/2.6-native-block-ship-20261108"]
permissions:
  contents: read
concurrency:
  group: ocean-neoforge-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  neoforge-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft 1.21.1 NeoForge with Java21
        run: chmod +x gradlew && ./gradlew --no-daemon clean build --console=plain
      - name: Store unverified test JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: first-ship-2-6-unverified-java21
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 10
