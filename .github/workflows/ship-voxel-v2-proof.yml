name: Ship V2 voxel and legacy compatibility proof

on:
  push:
    paths:
      - 'src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java'
      - 'src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java'
      - 'src/main/java/org/slavicmyths/ships/ShipSectionPlan.java'
      - 'src/shipProof/**'
      - '.github/workflows/ship-voxel-v2-proof.yml'
  pull_request:
    paths:
      - 'src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java'
      - 'src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java'
      - 'src/main/java/org/slavicmyths/ships/ShipSectionPlan.java'
      - 'src/shipProof/**'
      - '.github/workflows/ship-voxel-v2-proof.yml'

jobs:
  voxel-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile pure Java voxel model and proof
        run: |
          mkdir -p build/ship-voxel-proof
          javac --release 21 -encoding UTF-8 -d build/ship-voxel-proof \
            src/main/java/org/slavicmyths/ships/ShipSectionPlan.java \
            src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java \
            src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java \
            src/shipProof/java/org/slavicmyths/ships/ShipVoxelProof.java \
            src/shipProof/java/org/slavicmyths/ships/ShipVoxelExport.java
      - name: Check shaped hull, rigging, lanterns and V1 palette
        run: java -cp build/ship-voxel-proof org.slavicmyths.ships.ShipVoxelProof
      - name: Export source-derived hull voxel coordinates
        run: java -cp build/ship-voxel-proof org.slavicmyths.ships.ShipVoxelExport build/ship-voxel-proof/ship_voxels.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ship-v2-real-voxel-blueprints
          path: build/ship-voxel-proof/ship_voxels.csv
          if-no-files-found: error
