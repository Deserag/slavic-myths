name: Reward weapon balance integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/verify_weapon_balance.py --source-only
