name: Shipbuilding 2.6 - render-deck transform proof

on:
  push:
    paths:
      - "src/main/java/org/slavicmyths/ships/RaftTransforms.java"
      - "src/main/java/org/slavicmyths/ships/RaftSize.java"
      - "experimental/raft26/RaftTransformsProof.java"
      - ".github/workflows/shipbuilding-deck-frame-proof.yml"
  pull_request:
    paths:
      - "src/main/java/org/slavicmyths/ships/RaftTransforms.java"
      - "src/main/java/org/slavicmyths/ships/RaftSize.java"
      - "experimental/raft26/RaftTransformsProof.java"
      - ".github/workflows/shipbuilding-deck-frame-proof.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile pure Java21 raft local frame test
        run: |
          mkdir -p build/raft-transform-proof
          javac -encoding UTF-8 -d build/raft-transform-proof src/main/java/org/slavicmyths/ships/RaftSize.java src/main/java/org/slavicmyths/ships/RaftTransforms.java experimental/raft26/RaftTransformsProof.java
      - name: Verify every 3x3 to 5x7 cell through all turns
        run: java -ea -cp build/raft-transform-proof org.slavicmyths.ships.RaftTransformsProof
