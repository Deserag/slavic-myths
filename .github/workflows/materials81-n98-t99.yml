name: Materials81 N98 T99 resource gates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/materials81_n98_t99.py'
      - 'tools/verify_materials81_n98_t99.py'
      - 'src/main/resources/assets/slavicmyths/textures/item/*spearhead.png'
      - 'src/main/resources/assets/slavicmyths/textures/item/birch_bark.png'
      - 'src/main/resources/assets/slavicmyths/textures/item/animal_fat.png'
      - 'src/main/resources/assets/slavicmyths/textures/item/goat_hide.png'
      - 'src/main/resources/assets/slavicmyths/textures/item/large_animal_bone.png'
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/verify_materials81_n98_t99.py
      - run: chmod +x gradlew && ./gradlew --no-daemon clean build --console=plain
      - run: python tools/verify_materials81_n98_t99.py --jar
