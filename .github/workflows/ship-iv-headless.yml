name: Ship IV geometry and Java build

on:
  push:
    branches:
      - feat/2.6-largest-hull-overhaul-20261113
  pull_request:
    paths:
      - 'src/main/java/org/slavicmyths/ships/**'
      - 'tools/ship-iv-checks/**'
      - '.github/workflows/ship-iv-headless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ship-iv-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile independent production geometry and motion
        run: |
          mkdir -p .ship-iv-checks
          javac -encoding UTF-8 -d .ship-iv-checks \
            src/main/java/org/slavicmyths/ships/ShipSectionPlan.java \
            src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java \
            src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java \
            src/main/java/org/slavicmyths/ships/ShipRigidMotion.java \
            tools/ship-iv-checks/ShipIVHeadless.java
      - name: Geometry and motion regression (432 configurations)
        run: java -cp .ship-iv-checks org.slavicmyths.ships.ShipIVHeadless

  ship-mod-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile actual NeoForge mod
        run: ./gradlew compileJava --no-daemon -PwithoutJei
