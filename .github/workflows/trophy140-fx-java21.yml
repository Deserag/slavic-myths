name: Trophy Heads 140 - Java 21 native models and FX
on:
  push:
    branches:
      - feat/trophy140-likho-fx
      - feat/trophy140-remaining-head-fx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-heads:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Native source UV, animated bounds, trophy drop rules
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -I tools/heads140-offline.gradle verifyHeads140Offline
      - name: Clean production build (NeoForge 1.21.1)
        run: ./gradlew --no-daemon clean build --stacktrace
      - name: Production artifact
        run: |
          ls -lh build/libs/slavicmyths-*.jar
          sha256sum build/libs/slavicmyths-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: trophy140-six-head-fx-1.9.7.56
          path: build/libs/slavicmyths-*.jar
          if-no-files-found: error
          retention-days: 7
