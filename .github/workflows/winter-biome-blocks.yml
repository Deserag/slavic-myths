name: Winter biome blocks - Java 21
on:
  push:
    branches: [ "feature/winter-biome-completion-20261124" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew clean build --no-daemon --console=plain
      - run: python3 tools/verify_winter_blocks.py
      - uses: actions/upload-artifact@v4
        with:
          name: winter-biome-mod
          path: build/libs/*.jar
          if-no-files-found: error
