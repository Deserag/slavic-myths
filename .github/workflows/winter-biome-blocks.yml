name: Winter biome blocks - Java 21
on:
  push:
    branches: [ "feature/winter-biome-completion-20261124" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify deterministic encounter layout
        run: |
          mkdir -p /tmp/winter-layout
          javac -d /tmp/winter-layout src/main/java/org/slavicmyths/winter/WinterEncounterLayout.java tools/winter-tests/WinterLayoutCheck.java
          java -cp /tmp/winter-layout WinterLayoutCheck
      - name: Verify approved frozen ship V2 geometry
        run: python3 tools/verify_frozen_ship_v2.py
      - run: chmod +x gradlew
      - run: ./gradlew clean build --no-daemon --console=plain
      - run: python3 tools/verify_winter_blocks.py
      - uses: actions/upload-artifact@v4
        with:
          name: winter-biome-mod
          path: build/libs/*.jar
          if-no-files-found: error
