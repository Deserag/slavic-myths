name: Registry and loader smoke

on:
  push:
    branches:
      - fix/event-bus-register-crash
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Java version and wrapper
        run: |
          java -version
          chmod +x ./gradlew
          ./gradlew --version
      - name: Compile and assemble production mod
        run: ./gradlew --no-daemon --stacktrace clean compileJava build
      - name: Load NeoForge and run registry-dependent GameTests
        run: ./gradlew --no-daemon --stacktrace -PportRuntimeCheck runRuntimeChecks
