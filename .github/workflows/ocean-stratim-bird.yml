name: Stratim Bird - Java 21 and ocean GameTests

on:
  push:
    branches: [integration/ocean-updates]
    paths:
      - ".github/workflows/ocean-stratim-bird.yml"
      - "src/main/java/org/slavicmyths/marine/StratimBird*.java"
      - "src/main/java/org/slavicmyths/client/StratimBird*.java"
      - "src/main/java/org/slavicmyths/SlavicMyths.java"
      - "src/main/java/org/slavicmyths/client/ClientSetup.java"
      - "src/main/resources/data/slavicmyths/neoforge/biome_modifier/stratim_bird_spawns.json"
      - "src/main/resources/data/slavicmyths/tags/worldgen/biome/spawn_stratim_bird.json"
      - "src/main/resources/assets/slavicmyths/blockstates/stratim_bird_head.json"
      - "src/main/resources/assets/slavicmyths/models/item/stratim_bird*.json"
      - "tools/pharaohka-tests/org/slavicmyths/marine/StratimBirdGameTests.java"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod from scratch
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --console=plain
      - name: Isolated real NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PpharaohkaCheck runPharaohkaTests --no-daemon --console=plain 2>&1 | tee /tmp/stratim-tests.log
          if grep -Eqi 'Failed to start the minecraft server|ModLoadingCrashException|GameTest.*failed|[0-9]+ required tests failed|ExceptionInInitializerError|Failed to create mod instance' /tmp/stratim-tests.log; then
            exit 1
          fi
          grep -Eq 'All [0-9]+ required tests passed' /tmp/stratim-tests.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: stratim-bird-java21-verified
          path: build/libs/slavicmyths-*.jar
          retention-days: 7
          if-no-files-found: error
