name: Ship sails #507 - isolated actual Minecraft visual QA

on:
  pull_request:
    branches:
      - fix/ships-3-4-wip
    paths:
      - 'tools/ship-sail-visual/**'
      - 'tools/ship-sail-visual.gradle'
      - '.github/workflows/ship-sail-507-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-ship-client:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install isolated framebuffer and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1
      - name: Build production JAR and independent visual QA mod
        run: |
          chmod +x gradlew
          mkdir -p /tmp/ship-sail-visual
          ./gradlew --no-daemon -I tools/ship-sail-visual.gradle clean build compileShipSailVisualJava --console=plain
          sha256sum build/libs/*.jar | tee /tmp/ship-sail-visual/jar.sha256
          git rev-parse HEAD | tee /tmp/ship-sail-visual/source.txt
      - name: One actual test client in separate temporary singleplayer world
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' timeout 22m ./gradlew --no-daemon -I tools/ship-sail-visual.gradle runShipSailVisual --console=plain 2>&1 | tee /tmp/ship-sail-visual/client.log
      - name: Verify all 72 genuine framebuffer captures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/ship-sail-visual/frames')
          receipt=json.loads((root/'finished.json').read_text())
          assert receipt['captured'] == 72
          assert receipt['status']=='CAPTURE_COMPLETE_NOT_OWNER_ACCEPTANCE'
          assert len(receipt['frames'])==72
          assert len(receipt['motion_frames'])==3
          assert all((root/frame['file']).is_file()
                     for frame in receipt['motion_frames'])
          assert all((root/frame['file']).is_file() for frame in receipt['frames'])
          assert all(frame['pressure_source']=='SIMULATED_PRESSURE_VISUAL_ONLY'
                     for frame in receipt['frames'])
          print('All 72 actual-client screenshots exist. Pressure is simulated.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-sails-507-real-client-frames-${{ github.sha }}
          path: |
            /tmp/ship-sail-visual/
            build/ship-sail-visual/
            work/ship-sail-visual-isolated/logs/
          retention-days: 14
