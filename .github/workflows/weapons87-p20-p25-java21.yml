name: Weapons 87 P20-25 unique art Java21
on:
  push:
    branches:
      - feat/weapons87-p20-p25-unique-art
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install source-render dependencies
        run: python3 -m pip install --quiet pillow numpy
      - name: Verify production and render actual sources
        run: python3 tools/weapons87_unique_art.py --check
      - name: Capture exact original main for immutable-KEEP comparison
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = ad9897b0eb4c5bb63462484d63a31e6593e05e4b
      - name: Prove #186-#188 source-KEEP assets and distinct silhouettes
        run: python3 tools/verify_weapons87_unique_keeps.py
      - name: Java21 clean NeoForge build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Verify owned models, textures and production JAR
        run: |
          python3 tools/weapons87_unique_art.py --check --jar
          python3 tools/verify_weapons87_unique_keeps.py
          python3 tools/weapons87_unique_art.py --render
          sha256sum build/libs/slavicmyths-*.jar
      - name: Historical full #87 generator gate (legacy main baseline diagnostic)
        continue-on-error: true
        run: |
          python3 tools/verify_weapons87.py --generators --jar
      - name: Publish JAR and source projections
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weapons87-unique-p20-p25-source-and-jar
          path: |
            docs/implementation/weapons87/blueprints/uniques-p20-p25/ci-source-views/*.png
            build/libs/slavicmyths-*.jar
          if-no-files-found: error
          retention-days: 14
