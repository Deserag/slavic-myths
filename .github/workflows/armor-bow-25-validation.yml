name: Slavic Myths 2.5 armor and bows validation
on:
  push:
    branches:
      - release-2.5
      - integration/2.5-content-no-ships-20261110
  workflow_dispatch:
  pull_request:
    branches:
      - release-2.5
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install matplotlib pillow
      - run: python tools/validate_25_assets.py --preview
      - run: python tools/validate_visual_25.py --preview
      - run: python tools/preview_25_bows.py
      - run: python tools/preview_25_equipped.py
      - run: python tools/generate_sister_artifacts_2d.py --preview
      - run: python tools/generate_sister_artifacts_2d.py --check
      - run: python tools/verify_sister_artifacts_2d.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sisters-armor-bows-geometry
          path: |
            build/armor-25-previews/
            build/bow-25-previews/
            build/equipped-25-previews/
            build/sisters-artifact-25-previews/
            build/visual-25-previews/
          if-no-files-found: warn
      - run: chmod +x ./gradlew && ./gradlew clean build --no-daemon --stacktrace
