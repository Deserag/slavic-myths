name: Weapons87 Kalin wave Java21
on:
  push:
    branches:
      - fix/weapons87-kalin-feedback-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source regressions
        run: |
          python3 tools/verify_weapons87_kalin_wave.py
          python3 tools/weapons87_owner_qa.py
          python3 tools/verify_weapons87_thunderaxe.py
      - name: Java21 clean build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Verify packaged weapons
        run: |
          python3 tools/weapons87_owner_qa.py --jar
          python3 tools/weapons87_live_audit.py --jar
          sha256sum build/libs/slavicmyths-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: weapons87-kalin-wave-jar
          path: build/libs/slavicmyths-*.jar
          retention-days: 14
