name: Bossbar tier colors — Java 21
on:
  push:
    branches:
      - 'fix/bossbar-tier-colors-20261105'
      - 'codex/416-posad-fixes-20261105'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bossbar owner and palette consistency
        run: python3 tools/verify_bossbar_tiers.py
      - name: Clean NeoForge production build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --console=plain
      - name: Confirm production JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name 'slavicmyths-*.jar' ! -name '*sources*' | head -n 1)
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'org/slavicmyths/combat/BossBarPalette.class'
          sha256sum "$JAR"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: slavicmyths-bossbar-colors
          path: build/libs/slavicmyths-*.jar
          retention-days: 7
