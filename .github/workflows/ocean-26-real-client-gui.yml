name: Ocean 2.6 - real client visual and helm regressions

on:
  workflow_dispatch:
  push:
    branches:
      - fix/2.6-ship-crew-and-upgrades-p0
      - feat/2.6-large-ship-closed-decks-p1
    paths:
      - "src/main/java/org/slavicmyths/ships/**"
      - "tools/ocean26-client-tests/**"
      - "tools/ocean26-tests/**"
      - "build.gradle"
      - ".github/workflows/ocean-26-real-client-gui.yml"

permissions:
  contents: read

concurrency:
  group: ocean26-real-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "4.5"
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and Mesa software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 mesa-utils xauth
      - id: server_tests
        continue-on-error: true
        name: Build an isolated Minecraft world using server GameTests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -Pocean26Check runOcean26Checks
          test -f run-ocean26-20261108/world/level.dat
      - name: Prepare disposable worlds for the rendering and helm tests
        run: |
          mkdir -p run-ocean26-client/saves
          cp -a run-ocean26-20261108/world run-ocean26-client/saves/ShipyardCi
          cp -a run-ocean26-20261108/world run-ocean26-client/saves/CaptainCi
          cp -a run-ocean26-20261108/world run-ocean26-client/saves/CaptainTurnCi
      - name: Configure isolated Minecraft 1.21.1 client before first launch
        run: |
          # These are Minecraft Options keys, not JVM flags. The game directory is
          # run-ocean26-client (configured in build.gradle).
          mkdir -p run-ocean26-client
          cat > run-ocean26-client/options.txt <<'EOF'
          version:3955
          onboardAccessibility:false
          narrator:0
          pauseOnLostFocus:false
          guiScale:4
          fullscreen:false
          graphicsMode:0
          renderDistance:4
          simulationDistance:5
          mipmapLevels:0
          maxFps:60
          enableVsync:false
          EOF
          grep -qx 'onboardAccessibility:false' run-ocean26-client/options.txt
          grep -qx 'version:3955' run-ocean26-client/options.txt
          test -s run-ocean26-client/options.txt
          echo "Prepared isolated Minecraft options for 1.21.1 (3955)"
      - id: shipyard
        continue-on-error: true
        name: Render actual shipyard GUI at scale 4, swap vessel types
        run: |
          ( sleep 90
            echo "OCEAN26_STARTUP_DIAGNOSTIC $(date -u)"
            jps -l || true
            for pid in $(jps -l | awk '/devlaunch.Main/ {print $1}'); do
              jcmd "$pid" Thread.print > client-thread-dump.txt || true
            done
          ) &
          diagnostic_pid=$!
          set +e
          timeout --signal=TERM --kill-after=20s 300s xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./gradlew --no-daemon --console=plain -Pocean26ClientProbe \
              -Pocean26ShipyardSwitchProbe -Pocean26ProbeWorld=ShipyardCi runOcean26ClientProbe
          result=$?
          set -e
          kill "$diagnostic_pid" 2>/dev/null || true
          test "$result" -eq 0
          grep -q '^PASS shipyardSwitch' run-ocean26-client/ocean26-probe-result.txt
          cp run-ocean26-client/ocean26-probe-result.txt shipyard-result.txt
      - id: captain
        continue-on-error: true
        name: Run the captain camera probe independently of shipyard outcome
        run: |
          timeout --signal=TERM --kill-after=20s 300s xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./gradlew --no-daemon --console=plain -Pocean26ClientProbe \
              -Pocean26ModularVisualProbe -Pocean26LongForwardProbe \
              -Pocean26ShipClass=MEDIUM -Pocean26ProbeWorld=CaptainCi runOcean26ClientProbe
          grep -q '^PASS longForward' run-ocean26-client/ocean26-probe-result.txt
          cp run-ocean26-client/ocean26-probe-result.txt captain-result.txt
      - id: captain_turn
        continue-on-error: true
        name: Test both W+D and W+A turns, camera switching, Shift dismount
        run: |
          timeout --signal=TERM --kill-after=20s 300s xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./gradlew --no-daemon --console=plain -Pocean26ClientProbe \
              -Pocean26ModularVisualProbe -Pocean26TurnCameraProbe \
              -Pocean26ShipClass=MEDIUM -Pocean26ProbeWorld=CaptainTurnCi runOcean26ClientProbe
          grep -q '^PASS turnCamera' run-ocean26-client/ocean26-probe-result.txt
          cp run-ocean26-client/ocean26-probe-result.txt captain-turn-result.txt
      - name: Record real client scenario outcomes
        if: always()
        env:
          SERVER_TESTS_OUTCOME: ${{ steps.server_tests.outcome }}
          SHIPYARD_OUTCOME: ${{ steps.shipyard.outcome }}
          CAPTAIN_OUTCOME: ${{ steps.captain.outcome }}
          CAPTAIN_TURN_OUTCOME: ${{ steps.captain_turn.outcome }}
        run: |
          {
            printf 'client_startup: see latest.log and scenario markers\n'
            printf 'server_game_tests: %s\n' "$SERVER_TESTS_OUTCOME"
            printf 'shipyard: %s\n' "$SHIPYARD_OUTCOME"
            printf 'captain: %s\n' "$CAPTAIN_OUTCOME"
            printf 'captain_turn_and_dismount: %s\n' "$CAPTAIN_TURN_OUTCOME"
            test -f shipyard-result.txt && cat shipyard-result.txt && printf '\n' || true
            test -f captain-result.txt && cat captain-result.txt && printf '\n' || true
            test -f captain-turn-result.txt && cat captain-turn-result.txt && printf '\n' || true
          } | tee client-scenario-summary.txt
          {
            printf '### Real Minecraft client scenarios\n'
            printf '\n| Scenario | GitHub step outcome |\n|---|---|\n'
            printf '| Server GameTests | %s |\n' "$SERVER_TESTS_OUTCOME"
            printf '| Shipyard, GUI scale 4 | %s |\n' "$SHIPYARD_OUTCOME"
            printf '| Captain camera, long forward | %s |\n' "$CAPTAIN_OUTCOME"
            printf '| Captain W+D, W+A, 1P/3P, dismount | %s |\n' "$CAPTAIN_TURN_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve client logs and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean26-real-client-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            client-scenario-summary.txt
            run-ocean26-client/options.txt
            shipyard-result.txt
            captain-result.txt
            captain-turn-result.txt
            client-thread-dump.txt
            run-ocean26-client/ocean26-probe-result.txt
            run-ocean26-client/logs/latest.log
            run-ocean26-client/crash-reports/**
            run-ocean26-client/screenshots/**
      - name: Enforce both independent client scenarios
        if: always()
        env:
          SERVER_TESTS_OUTCOME: ${{ steps.server_tests.outcome }}
          SHIPYARD_OUTCOME: ${{ steps.shipyard.outcome }}
          CAPTAIN_OUTCOME: ${{ steps.captain.outcome }}
          CAPTAIN_TURN_OUTCOME: ${{ steps.captain_turn.outcome }}
        run: |
          test "$SERVER_TESTS_OUTCOME" = success
          test "$SHIPYARD_OUTCOME" = success
          test "$CAPTAIN_OUTCOME" = success
          test "$CAPTAIN_TURN_OUTCOME" = success
