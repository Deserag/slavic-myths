name: Integration Pharaohka after Ships (temporary)
on:
  push:
    branches:
      - integration/release-ships-pharaohka-buyan-20261118
    paths:
      - .github/workflows/integration-pharaohka-20261118.yml
permissions:
  contents: write
jobs:
  merge-pharaohka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge water boss and preserve accepted ship code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/фараонка:refs/remotes/origin/pharaohka-source"
          git merge --no-ff --no-commit -s ort -X ours origin/pharaohka-source || true
          while IFS= read -r -d '' path; do
            git checkout --ours -- "$path" || git rm -f -- "$path"
            git add -A -- "$path"
          done < <(git diff --name-only --diff-filter=U -z)
          if test -f .git/MERGE_HEAD; then
            git commit -m "Merge Pharaohka water boss after ships, retain ship-compatible registration"
          else
            echo "No merge needed"
          fi
          test -s tools/pharaohka-test-resources/data/slavicmyths_pharaohka/structure/empty.nbt
          test -s src/main/java/org/slavicmyths/marine/PharaohkaEntity.java
          grep -Fq 'PharaohkaContent.init(bus)' src/main/java/org/slavicmyths/SlavicMyths.java
          grep -Fq 'PharaohkaRenderer::register' src/main/java/org/slavicmyths/client/ClientSetup.java
          git push origin "HEAD:refs/heads/integration/release-ships-pharaohka-buyan-20261118"
