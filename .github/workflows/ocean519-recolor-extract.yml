name: Ocean #519 — real vanilla pixel recolor extraction
on:
  push:
    branches: [feature/ocean-rewards-completion-20261120]
    paths:
      - '.github/workflows/ocean519-recolor-extract.yml'
      - 'tools/ocean519_recolor.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recolor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare NeoForge 1.21.1 vanilla assets
        run: chmod +x gradlew && ./gradlew classes --no-daemon --console=plain
      - name: Install pixel image processor
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Recolor vanilla item sprites, preserving their silhouettes
        run: python3 tools/ocean519_recolor.py
      - name: Export actual generated PNGs
        uses: actions/upload-artifact@v4
        with:
          name: ocean519-vanilla-recolored-png
          path: build/ocean519-recolor/*.png
          if-no-files-found: error
          retention-days: 7
