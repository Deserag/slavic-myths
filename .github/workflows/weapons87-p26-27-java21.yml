name: Weapons 87 P26-27 audit and Thunder Axe Java21
on:
  push:
    branches:
      - feat/weapons87-p26-27-audit-thunderaxe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact 68 item source provenance and Thunder Axe guards
        run: |
          python3 tools/weapons87_live_audit.py
          python3 tools/verify_weapons87_thunderaxe.py
      - name: Java 21 NeoForge clean production build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Check all current weapons and production JAR
        run: |
          python3 tools/weapons87_live_audit.py --jar
          python3 tools/verify_weapons87_thunderaxe.py
          test -n "$(find build/libs -maxdepth 1 -name 'slavicmyths-*.jar' -size +100k -print -quit)"
          sha256sum build/libs/slavicmyths-*.jar
      - name: Publish scoped audit, build and current snapshot
        uses: actions/upload-artifact@v4
        with:
          name: weapons87-p26-27-audit-java21
          path: |
            build/weapons87-live-audit/current-68.json
            build/weapons87-live-audit/current-68.csv
            build/libs/slavicmyths-*.jar
          retention-days: 14
