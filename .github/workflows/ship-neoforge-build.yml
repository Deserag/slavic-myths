name: NeoForge ship build validation

on:
  push:
    branches:
      - 'feature/2.6-ship-superstructures-20261110'
    paths:
      - 'src/main/java/org/slavicmyths/ships/**'
      - 'build.gradle'
      - '.github/workflows/ship-neoforge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and assemble mod
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
      - name: Run dedicated Ocean 2.6 NeoForge GameTests
        shell: bash
        run: |
          ./gradlew --no-daemon -Pocean26Check runOcean26Checks
      - name: Show built files and SHA256
        if: success()
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print -exec sha256sum {} \;
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: slavic-myths-ship-build
          path: build/libs/*.jar
          if-no-files-found: error
