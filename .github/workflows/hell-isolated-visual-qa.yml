name: Hell isolated client visual QA
on:
  push:
    branches: [hell]
    paths:
      - '.github/workflows/hell-isolated-visual-qa.yml'
      - 'tools/hell-visual-qa/**'
      - 'tools/hell-visual-qa-resources/**'
      - 'tools/hell-visual-qa.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    if: github.ref == 'refs/heads/hell'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1
      - name: Build production JAR
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p /tmp/hell-visual-qa
          ./gradlew --no-daemon clean build --console=plain 2>&1 | tee /tmp/hell-visual-qa/build.log
          sha256sum build/libs/slavicmyths-*.jar | tee /tmp/hell-visual-qa/jar.sha256
          git rev-parse HEAD | tee /tmp/hell-visual-qa/source.txt
      - name: Capture actual packaged mod in isolated Xvfb client
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' sh -c 'glxinfo -B; timeout 15m ./gradlew --no-daemon -I tools/hell-visual-qa.gradle runHellVisualQa --console=plain' 2>&1 | tee /tmp/hell-visual-qa/client.log
          test -f build/hell-visual-qa/frames/finished.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hell-isolated-client-${{ github.sha }}
          path: |
            /tmp/hell-visual-qa/
            build/hell-visual-qa/
            work/hell-visual-qa-isolated/logs/
          retention-days: 14
