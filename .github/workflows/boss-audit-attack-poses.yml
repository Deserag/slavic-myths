name: Boss audit controlled attack poses
on:
  push:
    branches: ['codex/qa-bosses-release25-20261106']
    paths: ['tools/boss-audit/REQUEST_ATTACK_POSES','.github/workflows/boss-audit-attack-poses.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1
      - run: chmod +x gradlew && ./gradlew --no-daemon -I tools/boss-audit-visual.gradle clean build compileBossAuditVisualJava --console=plain
      - run: xvfb-run -a -s '-screen 0 1280x800x24' timeout 20m ./gradlew --no-daemon -I tools/boss-audit-visual.gradle runBossAuditVisual -PbossAuditPosesOnly=true -PbossAuditIds=gneteya,tryaseya,agneya,ledeya,lomeya,neveya,viy --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-audit-attack-poses
          path: |
            build/boss-audit-visual/
            work/boss-audit/hosted-client/logs/
          retention-days: 7
