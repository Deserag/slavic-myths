name: Ship planning and sail physics checks

on:
  push:
    paths:
      - 'src/main/java/org/slavicmyths/ships/ShipSectionPlan.java'
      - 'src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java'
      - 'src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java'
      - 'src/main/java/org/slavicmyths/ships/ShipRigging.java'
      - 'src/main/java/org/slavicmyths/ships/ShipRigidMotion.java'
      - 'src/main/java/org/slavicmyths/ships/ShipSailMotion.java'
      - 'tools/ship-section-tests/**'
      - '.github/workflows/ship-plans.yml'
  pull_request:
    paths:
      - 'src/main/java/org/slavicmyths/ships/ShipSectionPlan.java'
      - 'src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java'
      - 'src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java'
      - 'src/main/java/org/slavicmyths/ships/ShipRigging.java'
      - 'src/main/java/org/slavicmyths/ships/ShipRigidMotion.java'
      - 'src/main/java/org/slavicmyths/ships/ShipSailMotion.java'
      - 'tools/ship-section-tests/**'
      - '.github/workflows/ship-plans.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile isolated ship planning tests
        shell: bash
        run: |
          mkdir -p build/ship-checks
          javac -encoding UTF-8 -d build/ship-checks \
            src/main/java/org/slavicmyths/ships/ShipSectionPlan.java \
            src/main/java/org/slavicmyths/ships/ShipSuperstructurePlan.java \
            src/main/java/org/slavicmyths/ships/ShipHullVoxelLayout.java \
            src/main/java/org/slavicmyths/ships/ShipRigging.java \
            src/main/java/org/slavicmyths/ships/ShipRigidMotion.java \
            src/main/java/org/slavicmyths/ships/ShipSailMotion.java \
            tools/ship-section-tests/ShipSectionPlanCheck.java \
            tools/ship-section-tests/ShipSuperstructureCheck.java \
            tools/ship-section-tests/ShipSailMotionCheck.java \
            tools/ship-section-tests/ShipHullVoxelLayoutCheck.java \
            tools/ship-section-tests/ShipBrigantineVoxelExport.java
      - name: Validate sections, superstructures and sail physics
        shell: bash
        run: |
          java -cp build/ship-checks ShipSectionPlanCheck
          java -cp build/ship-checks ShipSuperstructureCheck
          java -cp build/ship-checks ShipSailMotionCheck
          java -cp build/ship-checks ShipHullVoxelLayoutCheck

      - name: Export actual tier III voxels for Python inspection
        shell: bash
        run: |
          java -cp build/ship-checks ShipBrigantineVoxelExport build/ship-previews
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: brigantine-iii-java-voxels
          path: build/ship-previews/*.csv
          if-no-files-found: error
