name: Weapons87 P33 Storm Staff VFX Java21
on:
  push:
    branches:
      - feat/weapons87-p33-storm-vfx-and-animation-audits
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 tools/verify_weapons87_p33.py
      - name: Java21 clean build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Verify production jar and 68 registered weapons
        run: |
          python3 tools/verify_weapons87_p33.py --jar
          python3 tools/weapons87_live_audit.py --jar
          sha256sum build/libs/slavicmyths-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: weapons87-p33-vfx-jar
          path: build/libs/slavicmyths-*.jar
          retention-days: 14
